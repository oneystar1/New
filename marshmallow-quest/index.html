<title>Marshmallow Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen arcade cabinet. A 256x224 SNES-size canvas scaled with crisp pixels,
   centered on a dark cabinet background, touch pad under it on phones. Single dark look. */
:root{
  --bg:#17111c; --panel:#241a2c; --line:#4a3756; --fg:#f6ecdc; --muted:#b9a5c6;
  --accent:#ffb347; --fire:#ff5a2b; --mallow:#fff6e8;
  --font-pixel:"Press Start 2P", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-pixel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
#wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;max-width:100%;max-height:100%;
  border:4px solid var(--line);box-shadow:0 0 0 2px #000,0 12px 40px #000c;touch-action:none}
#top{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:center;line-height:1.6}
#top b{color:var(--accent);font-weight:normal}
#pad{display:none;width:100%;max-width:440px;justify-content:space-between;align-items:center;gap:12px;
  margin:auto 0;padding-bottom:env(safe-area-inset-bottom,0px);flex:0 0 auto}
body.touch #wrap{flex:0 0 auto}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px}
.mid button{position:static;width:72px;height:30px;border-radius:15px;font-size:8px}
body.touch #pad{display:flex}
body.touch #top{display:none}
body.touch #wrap{align-items:flex-start}
.stick{position:relative;width:136px;height:136px;border-radius:50%;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 18px #1c1422;touch-action:none;user-select:none;-webkit-user-select:none}
.stick .knob{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:var(--line);border:3px solid var(--muted);box-sizing:border-box;box-shadow:0 3px 0 #000a;pointer-events:none;transition:transform .05s}
.stick.on .knob{background:var(--accent);border-color:#fff}
.stick::before{content:"";position:absolute;left:62px;top:14px;width:12px;height:12px;border-left:3px solid var(--line);border-top:3px solid var(--line);transform:rotate(45deg);opacity:.6}
.btns button{position:absolute;background:var(--panel);border:3px solid var(--line);color:var(--fg);
  font-family:var(--font-pixel);font-size:12px;border-radius:8px;width:44px;height:44px;touch-action:none;user-select:none;-webkit-user-select:none}
.btns button:active,.btns button.on{background:var(--line)}
.btns{position:relative;width:136px;height:136px}
.btns button{width:56px;height:56px;border-radius:50%}
.btns .b{left:4px;top:70px;border-color:#5a7fc6}.btns .a{left:72px;top:26px;border-color:var(--fire)}
.mid button{background:var(--panel);border:3px solid var(--line);color:var(--fg);font-family:var(--font-pixel);touch-action:none;user-select:none;-webkit-user-select:none}
.mid button.on{background:var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div id="top">Arrows/WASD move &nbsp;·&nbsp; <b>Z</b> or <b>J</b> sword &nbsp;·&nbsp; <b>X</b> or <b>K</b> spear &nbsp;·&nbsp; <b>Enter</b> start/pause &nbsp;·&nbsp; <b>M</b> mute</div>
<div id="wrap"><canvas id="c" width="256" height="224" aria-label="Marshmallow Quest game screen"></canvas></div>
<div id="pad">
  <div class="stick" id="stick" aria-label="Joystick"><div class="knob" id="knob"></div></div>
  <div class="mid"><button class="s" data-k="start" aria-label="Start">START</button></div>
  <div class="btns"><button class="b" data-k="b" aria-label="Spear">B</button><button class="a" data-k="a" aria-label="Sword">A</button></div>
</div>
<script>
// ===================== MARSHMALLOW QUEST =====================
// A 16-bit top-down adventure. You are Puff, a marshmallow. Your buddies were
// carried off to Ember Keep by the fire monsters. Get too close to fire and you
// toast; toast all the way and you melt. Find the Fire Spear to put flames out.
'use strict';

ctx.imageSmoothingEnabled=false;

const pressed={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',KeyJ:'a',Space:'a',KeyX:'b',KeyK:'b',ShiftLeft:'b',Enter:'start',Escape:'start',KeyM:'mute'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(!keys[k])pressed[k]=1;keys[k]=1;audio.unlock();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();keys[k]=0;});
function justPressed(k){const v=pressed[k];pressed[k]=0;return !!v;}
// touch pad
const pad=document.getElementById('pad');
function bindBtn(btn){const k=btn.dataset.k;
  const on=e=>{e.preventDefault();btn.classList.add('on');if(!keys[k])pressed[k]=1;keys[k]=1;audio.unlock();};
  const off=e=>{e.preventDefault();btn.classList.remove('on');keys[k]=0;};
  btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
  btn.addEventListener('contextmenu',e=>e.preventDefault());}
pad.querySelectorAll('button').forEach(bindBtn);
// analog joystick
const joy={x:0,y:0,on:false};
{const st=document.getElementById('stick'),kn=document.getElementById('knob');let pid=null;
  const upd=e=>{const r=st.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width/2-12;const d=Math.hypot(dx,dy);
    if(d>max){dx=dx/d*max;dy=dy/d*max;}kn.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.min(1,d/max);
    if(m<0.18){joy.x=joy.y=0;}else{const a=Math.atan2(dy,dx);const k=(m-0.18)/0.82;joy.x=Math.cos(a)*k;joy.y=Math.sin(a)*k;}};
  st.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{st.setPointerCapture(pid);}catch(err){}st.classList.add('on');joy.on=true;audio.unlock();upd(e);});
  st.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e);});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;joy.on=false;joy.x=joy.y=0;st.classList.remove('on');kn.style.transform='';};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);st.addEventListener('contextmenu',e=>e.preventDefault());}
addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
addEventListener('touchstart',()=>{if(typeof fit==='function')fit();},{once:true,passive:true});

// ---------- audio (tiny chiptune synth) ----------
const audio={ctx:null,muted:false,unlock(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,d,type='square',vol=0.08,slide=0){if(!this.ctx||this.muted)return;const t=this.ctx.currentTime;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d);},
  sfx(n){switch(n){
    case 'sword':this.tone(900,0.08,'square',0.05,-500);break;
    case 'spear':this.tone(300,0.18,'sawtooth',0.05,900);break;
    case 'hit':this.tone(200,0.1,'square',0.07,-120);break;
    case 'hurt':this.tone(140,0.25,'sawtooth',0.08,-90);break;
    case 'douse':this.tone(1200,0.3,'triangle',0.07,-900);setTimeout(()=>this.tone(500,0.2,'sine',0.05,-300),80);break;
    case 'item':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.15,'square',0.06),i*90));break;
    case 'free':[784,988,1175,1568,1175,1568].forEach((f,i)=>setTimeout(()=>this.tone(f,0.14,'triangle',0.07),i*80));break;
    case 'glaze':this.tone(660,0.12,'sine',0.06,400);break;
    case 'door':this.tone(220,0.15,'triangle',0.06,-100);break;
    case 'text':this.tone(1500,0.02,'square',0.02);break;
    case 'melt':[400,330,260,180,120].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'sawtooth',0.06,-40),i*160));break;
    case 'boss':this.tone(90,0.4,'sawtooth',0.1,-40);break;
    case 'win':[523,659,784,1046,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,'square',0.06),i*120));break;
  }}
};

spr(['.......Xr.......','.....XrOrX......','.....XrYOX......','....kSSSSSk.....','...kSSSSSSSk....','...kSszzzzSk....','...kSsOYYOSk....','...kSszzzzSk....',
'..kkksSSSskkk...','.kCCkSSSSSkMMk..','.kccksSSSskMmk..','.kCCksSSSskMMk..','..kkkzSSSzkkk...','...ksz...zsk....','...kss...ssk....','...kkk...kkk....'])];

const BOSS=[spr([

'...kzzzzzzkzSSSSSSSSzkzzzzzzk...','...kzMMzzzkzSSzzzzSSzkzzzMMzk...','...kzMMzzzkzSzzMMzzSzkzzzMMzk...','...kzzzzzzkzSzzMMzzSzkzzzzzzk...','....kkkkkkkzSSzzzzSSzkkkkkkk....',
'.......kzzzzSSSSSSSSzzzzk.......','......kzzzkkzzzzzzzzkkzzzk......','......kzzk..kzzzzzzk..kzzk......','......kzzk..kzzzzzzk..kzzk......','.....kkkkk..kkkkkkkk..kkkkk.....',
'................................','................................'])];

// Marshmallow body drawn procedurally so it can toast from white to brown to char.
function toastColor(t){const stops=[[255,250,240],[255,226,186],[222,166,84],[132,74,26],[38,20,16]];
  const s=Math.min(3.999,t*4),i=Math.floor(s),f=s-i;const a=stops[i],b=stops[i+1];
  return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;}
function shade(c,k){const m=c.match(/\d+/g).map(Number);return `rgb(${Math.min(255,m[0]*k)|0},${Math.min(255,m[1]*k)|0},${Math.min(255,m[2]*k)|0})`;}
// dir: 0 down,1 up,2 left,3 right. frame: walk phase 0..3. mood: 'ok','sad','happy'
function drawMallow(x,y,dir,frame,toast,mood='ok'){
  const col=toastColor(toast),dark=shade(col,0.78),hi=shade(col,1.08),out='#3a2420';
  x=Math.round(x);y=Math.round(y)+(frame===1||frame===3?1:0);
  const r=(c,i,j,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x+i,y+j,w,h);};
  // feet
  const fl=frame===1?1:frame===3?-1:0;r(out,4+fl,13,3,2);r(out,9-fl,13,3,2);r('#6b3a22',5+fl,13,1,1);r('#6b3a22',10-fl,13,1,1);
  // outline silhouette
  r(out,4,0,8,1);r(out,3,1,10,1);r(out,2,2,12,10);r(out,3,12,10,1);
  // body
  r(col,4,1,8,1);r(col,3,2,10,10);r(col,4,12,8,1);
  r(dark,11,3,2,9);r(dark,4,11,8,1);r(dark,10,2,2,1);
  r(hi,4,2,4,1);r(hi,3,3,1,4);r('#ffffff88',5,3,2,1);
  if(toast>0.55){r(shade(col,0.6),6,9,2,1);r(shade(col,0.6),9,5,1,2);r(shade(col,0.6),4,7,1,1);}
  // face
  if(dir===0){r(out,5,5,2,3);r(out,9,5,2,3);r('#fff',5,5,1,1);r('#fff',9,5,1,1);
    if(mood==='happy'){r(out,6,9,4,1);r(out,5,8,1,1);r(out,10,8,1,1);}
    else if(mood==='sad'){r(out,6,10,4,1);r(out,5,11,1,1);r(out,10,11,1,1);}
    else r(out,7,9,2,1);
    r('#ff9bb0aa',4,8,1,1);r('#ff9bb0aa',11,8,1,1);}
  else if(dir===2){r(out,4,5,2,3);r('#fff',4,5,1,1);r(out,4,9,2,1);r('#ff9bb0aa',7,8,1,1);}
  else if(dir===3){r(out,10,5,2,3);r('#fff',11,5,1,1);r(out,10,9,2,1);r('#ff9bb0aa',8,8,1,1);}
  else{r(dark,6,4,4,1);}
}
function drawShadow(x,y,w){ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(Math.round(x),Math.round(y),w/2,2.5,0,0,7);ctx.fill();}
// Donut house: 48x56 ring house with glaze, drips, sprinkles, arched door and a smoking chimney.

const G={scene:'title',map:null,mapName:'',cam:{x:0,y:0},t:0,frame:0,fade:0,fadeTo:null,
  flags:{sword:false,spear:false,gate:false,bossDead:false},freed:{},opened:{},lastHome:{map:'overworld',x:24,y:52},

const BUDDIES=['fluff','mallo','squish','dot','bibi','king'];
function freedCount(){return BUDDIES.filter(b=>G.freed[b]).length;}
function flagged(id){return !!(G.flags[id]||G.freed[id]||G.opened[id]);}

// ---------- entities ----------
function mkPlayer(x,y){return{type:'player',x,y,w:10,h:10,dir:0,frame:0,anim:0,toast:0,hurt:0,atk:0,atkType:null,speed:1.1,kb:{x:0,y:0},equip:'sword'};}
function mkEnemy(e){const base={type:'enemy',kind:e.kind,x:e.x*T+3,y:e.y*T+3,w:10,h:10,vx:0,vy:0,hurt:0,think:0,dead:0,home:{x:e.x*T+3,y:e.y*T+3}};
  if(e.kind==='ember')Object.assign(base,{hp:2,speed:0.55,heat:1.0,radius:30});
  if(e.kind==='knight')Object.assign(base,{hp:4,speed:0.8,heat:0.8,radius:26,sword:true});
  if(e.kind==='boss')Object.assign(base,{hp:9,speed:0.9,heat:1.6,radius:46,w:22,h:22,x:e.x*T-3,y:e.y*T+2,boss:true,phase:0,spit:0});
  return base;}
function loadMap(name,tx,ty,dir){const m=MAPS[name];G.map=m;G.mapName=name;G.frame=0;
  G.ents=[];G.shots=[];G.fx=[];
  for(const e of m.enemies){if(e.kind==='boss'&&G.flags.bossDead)continue;G.ents.push(mkEnemy(e));}
  // solid tiles for objects
  m.solidObj={};for(const o of m.objs){if(o.type==='buddy'&&!G.freed[o.id]){const w=o.w||1;for(let i=0;i<w;i++)m.solidObj[(o.x+i)+','+o.y]=1;}
    if(o.type==='chest'||o.type==='sign'||o.type==='npc'||o.type==='torch')m.solidObj[o.x+','+o.y]=1;
    if(o.type==='firegate'&&!G.flags.gate)for(let i=0;i<o.w;i++)m.solidObj[(o.x+i)+','+o.y]=1;
    if(o.type==='bossdoor'&&freedCount()<5)for(let i=0;i<o.w;i++)m.solidObj[(o.x+i)+','+o.y]=1;}
  P.x=tx*T+3;P.y=ty*T+3;P.dir=dir==null?P.dir:dir;P.kb.x=P.kb.y=0;P.atk=0;
  if(m.interior){G.lastHome={map:name,x:tx,y:ty};}
  updateCam(true);}
const P=mkPlayer(0,0);

function solidAt(px,py){const m=G.map;const i=Math.floor(px/T),j=Math.floor(py/T);if(i<0||j<0||i>=m.w||j>=m.h)return true;
  if(SOLID.has(m.t[j][i]))return true;if(m.solidObj[i+','+j])return true;return false;}
function hitsWall(x,y,w,h){return solidAt(x,y)||solidAt(x+w-1,y)||solidAt(x,y+h-1)||solidAt(x+w-1,y+h-1);}
function moveEnt(e,dx,dy){let moved=false;if(dx){const nx=e.x+dx;if(!hitsWall(nx,e.y,e.w,e.h)){e.x=nx;moved=true;}}
  if(dy){const ny=e.y+dy;if(!hitsWall(e.x,ny,e.w,e.h)){e.y=ny;moved=true;}}return moved;}
// Zelda-style corner sliding: if blocked on one axis, nudge along the other when only a corner is clipped.
function slideMove(e,dx,dy){if(dx){if(!moveEnt(e,dx,0)&&!dy){for(const n of[1,-1,2,-2,3,-3]){if(!hitsWall(e.x+dx,e.y+n,e.w,e.h)){e.y+=Math.sign(n)*Math.min(Math.abs(n),1);break;}}}}
  if(dy){if(!moveEnt(e,0,dy)&&!dx){for(const n of[1,-1,2,-2,3,-3]){if(!hitsWall(e.x+n,e.y+dy,e.w,e.h)){e.x+=Math.sign(n)*Math.min(Math.abs(n),1);break;}}}}}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function dist(a,b){const dx=(a.x+a.w/2)-(b.x+b.w/2),dy=(a.y+a.h/2)-(b.y+b.h/2);return Math.hypot(dx,dy);}
function updateCam(snap){const m=G.map;let cx=P.x+P.w/2-W/2,cy=P.y+P.h/2-(H-24)/2;
  cx=Math.max(0,Math.min(m.w*T-W,cx));cy=Math.max(0,Math.min(m.h*T-(H-24),cy));
  if(m.w*T<W)cx=(m.w*T-W)/2;if(m.h*T<H-24)cy=(m.h*T-(H-24))/2;
  if(snap){G.cam.x=cx;G.cam.y=cy;}else{G.cam.x+=(cx-G.cam.x)*0.2;G.cam.y+=(cy-G.cam.y)*0.2;}}
function say(text,cb,who){const parts=Array.isArray(text)?text:[text];G.msgQ=parts.map(p=>({t:p,who}));G.msgCb=cb||null;nextMsg();}
function puff(x,y,col,n=6){for(let i=0;i<n;i++)G.fx.push({x,y,vx:(Math.random()-0.5)*1.6,vy:(Math.random()-0.9)*1.6,life:20+Math.random()*15,col});}

// ---------- update: player ----------
function attackBox(){const r=P.atkType==='spear'?26:16;const cx=P.x+P.w/2,cy=P.y+P.h/2;
  if(P.dir===0)return{x:cx-7,y:cy+2,w:14,h:r};if(P.dir===1)return{x:cx-7,y:cy-2-r,w:14,h:r};
  if(P.dir===2)return{x:cx-2-r,y:cy-7,w:r,h:14};return{x:cx+2,y:cy-7,w:r,h:14};}
function facingTile(){let i=Math.floor((P.x+P.w/2)/T),j=Math.floor((P.y+P.h/2)/T);if(P.dir===0)j++;else if(P.dir===1)j--;else if(P.dir===2)i--;else i++;return{i,j};}
function objAt(i,j,type){return G.map.objs.find(o=>(!type||o.type===type)&&i>=o.x&&i<o.x+(o.w||1)&&j>=o.y&&j<o.y+(o.h||1));}
function interact(){const f=facingTile();const o=objAt(f.i,f.j);if(!o)return false;
  if(o.type==='sign'){say(o.text,null,'SIGN');return true;}
  if(o.type==='npc'){const talked=o.talked;o.talked=true;
    say(talked?o.after:o.lines,()=>{if(o.gives&&!G.flags[o.gives]){G.flags[o.gives]=true;audio.sfx('item');say(["Puff got the SWORD! Press A to swing it. Hit fire monsters, then back off before you toast."],null,'ITEM');}
      if(o.heal&&P.toast>0.05){P.toast=0;audio.sfx('glaze');puff(P.x+5,P.y+5,'#fff',10);}},o.name);return true;}
  if(o.type==='chest'&&!G.opened[o.id]){G.opened[o.id]=true;G.flags[o.item]=true;audio.sfx('item');
    if(o.item==='spear'){P.equip='spear';say(["Puff got the FIRE SPEAR! Press B to thrust it. One poke puts any flame out.","A doused cage turns a toasted buddy white again. Now, north to Ember Keep!"],null,'ITEM');}return true;}
  return false;}
function updatePlayer(){
  if(P.hurt>0)P.hurt--;
  if(P.kb.x||P.kb.y){moveEnt(P,P.kb.x,P.kb.y);P.kb.x*=0.8;P.kb.y*=0.8;if(Math.abs(P.kb.x)<0.1)P.kb.x=0;if(Math.abs(P.kb.y)<0.1)P.kb.y=0;}
  if(P.atk>0){P.atk--;if(P.atk===0)P.atkType=null;return;}
  let dx=0,dy=0;if(keys.left)dx=-1;else if(keys.right)dx=1;if(keys.up)dy=-1;else if(keys.down)dy=1;
  if(dx&&dy){dx*=0.7071;dy*=0.7071;}
  if(joy.on&&(joy.x||joy.y)){const m=Math.hypot(joy.x,joy.y);const k=0.45+0.55*Math.min(1,m);dx=joy.x/m*k;dy=joy.y/m*k;}
  if(dx||dy){const ax=Math.abs(dx),ay=Math.abs(dy);
    // only change facing when the new axis clearly dominates, so diagonals don't flicker
    if(ax>ay*1.15)P.dir=dx<0?2:3;else if(ay>ax*1.15)P.dir=dy<0?1:0;
    slideMove(P,dx*P.speed,dy*P.speed);P.anim++;if(P.anim%8===0)P.frame=(P.frame+1)%4;}else P.anim=0;
  if(justPressed('a')){if(!interact()&&G.flags.sword){P.atk=14;P.atkType='sword';audio.sfx('sword');hitThings();}}
  if(justPressed('b')){if(G.flags.spear){P.atk=16;P.atkType='spear';audio.sfx('spear');hitThings();}else if(!interact()&&G.flags.sword){P.atk=14;P.atkType='sword';audio.sfx('sword');hitThings();}}
  // warps
  const ci=Math.floor((P.x+P.w/2)/T),cj=Math.floor((P.y+P.h/2)/T);
  for(const o of G.map.objs){if(o.type!=='warp')continue;if(o.needs&&!G.flags[o.needs])continue;
    if(ci>=o.x&&ci<o.x+(o.w||1)&&cj>=o.y&&cj<o.y+(o.h||1)){if(!o.silent)audio.sfx('door');startFade(()=>loadMap(o.to,o.tx,o.ty,o.dir));return;}}
  // jars
  for(const o of G.map.objs){if(o.type==='jar'&&!o.taken&&ci===o.x&&cj===o.y){o.taken=true;P.toast=Math.max(0,P.toast-0.6);audio.sfx('glaze');puff(P.x+5,P.y+5,'#ffb6d9',8);}}
}
function hitThings(){const box=attackBox();const spear=P.atkType==='spear';
  for(const e of G.ents){if(e.type!=='enemy'||e.dead||e.hurt)continue;if(!overlap(box,e)){continue;}
    if(e.boss){if(!spear){audio.sfx('hit');puff(e.x+11,e.y+11,'#ff8c1a',4);continue;}e.hp-=1;e.hurt=30;audio.sfx('douse');puff(e.x+11,e.y+11,'#9cc8ff',10);G.shake=8;
      if(e.hp<=0){e.dead=60;G.flags.bossDead=true;audio.sfx('win');}continue;}
    if(spear){e.hp=0;e.dead=20;audio.sfx('douse');puff(e.x+5,e.y+5,'#9cc8ff',10);}
    else{e.hp--;e.hurt=20;audio.sfx('hit');puff(e.x+5,e.y+5,'#ffd23f',5);const a=Math.atan2(e.y-P.y,e.x-P.x);e.vx=Math.cos(a)*3;e.vy=Math.sin(a)*3;if(e.hp<=0)e.dead=20;}}
  // objects: cages, gate, torches, boss door
  for(const o of G.map.objs){
    const ob={x:o.x*T,y:o.y*T,w:(o.w||1)*T,h:T};if(!overlap(box,ob))continue;
    if(o.type==='buddy'&&!G.freed[o.id]){
      if(o.cage==='wood'&&!spear){o.hits=(o.hits||0)+1;audio.sfx('hit');puff(ob.x+8,ob.y+8,'#8a5a2a',5);if(o.hits>=3)freeBuddy(o);}
      else if(o.cage==='wood'&&spear){audio.sfx('hit');puff(ob.x+8,ob.y+8,'#8a5a2a',3);}
      else if(o.cage==='fire'){if(spear)freeBuddy(o);else{audio.sfx('hit');P.toast=Math.min(1,P.toast+0.08);}}
      else if(o.cage==='boss'&&G.flags.bossDead&&spear)freeBuddy(o);}
    if(o.type==='firegate'&&!G.flags.gate){if(spear){G.flags.gate=true;audio.sfx('douse');puff(ob.x+16,ob.y+8,'#9cc8ff',16);delete G.map.solidObj[o.x+','+o.y];delete G.map.solidObj[(o.x+1)+','+o.y];say(["The flames hiss and die. The gate of Ember Keep is open!"],null,'GATE');}else{audio.sfx('hit');P.toast=Math.min(1,P.toast+0.08);}}
    if(o.type==='torch'&&!o.out&&spear){o.out=true;audio.sfx('douse');puff(ob.x+8,ob.y+4,'#9cc8ff',8);}
  }}
function freeBuddy(o){G.freed[o.id]=true;audio.sfx('free');const w=o.w||1;for(let i=0;i<w;i++)delete G.map.solidObj[(o.x+i)+','+o.y];
  puff(o.x*T+8*w,o.y*T+8,'#fff',14);o.freedAt=G.t;
  const n=freedCount();
  if(o.cage==='boss'){say(["My subjects... and my old friend Puff. Thank you. Ember Keep is ours once more!"],()=>{G.win=true;G.scene='win';audio.sfx('win');},o.name);return;}
  const lines=["Puff! You came! I was getting so toasty in there."];
  if(n===5){lines.push("A deep rumble... the throne room door slides open. The Pyre Lord is waiting.");delete G.map.solidObj['18,13'];delete G.map.solidObj['19,13'];delete G.map.solidObj['20,13'];delete G.map.solidObj['21,13'];}
  else lines.push(`${6-n} buddies still need rescuing.`);
  say(lines,null,o.name);}

// ---------- update: enemies, shots, heat ----------
function updateEnemies(){
  for(const e of G.ents){if(e.type!=='enemy')continue;
    if(e.dead){e.dead--;if(e.dead<=0)e.gone=true;continue;}
    if(e.hurt){e.hurt--;moveEnt(e,e.vx,e.vy);e.vx*=0.8;e.vy*=0.8;continue;}
    const d=dist(e,P);
    if(e.boss){e.phase++;const a=Math.atan2(P.y-e.y,P.x-e.x);
      if(e.phase%180<100){moveEnt(e,Math.cos(a)*e.speed,Math.sin(a)*e.speed);}
      else{moveEnt(e,Math.cos(a+Math.PI/2)*e.speed,Math.sin(a+Math.PI/2)*e.speed);
        if(e.phase%30===0){for(let k=-1;k<=1;k++){const b=a+k*0.35;G.shots.push({x:e.x+8,y:e.y+8,vx:Math.cos(b)*1.6,vy:Math.sin(b)*1.6,life:120});}audio.sfx('boss');}}
    }else{
      e.think--;
      if(d<90){const a=Math.atan2(P.y-e.y,P.x-e.x);e.vx=Math.cos(a)*e.speed;e.vy=Math.sin(a)*e.speed;if(e.kind==='knight'&&d<34&&e.think<0){e.think=50;}}
      else if(e.think<0){e.think=40+Math.random()*60;const a=Math.random()*6.28;const go=Math.random()<0.7;e.vx=go?Math.cos(a)*e.speed*0.6:0;e.vy=go?Math.sin(a)*e.speed*0.6:0;}
      if(!moveEnt(e,e.vx,e.vy)){e.vx=-e.vx;e.vy=-e.vy;}
    }
    // contact
    if(overlap(e,P)&&!P.hurt){P.hurt=40;P.toast=Math.min(1,P.toast+(e.boss?0.25:0.15));audio.sfx('hurt');G.shake=5;
      const a=Math.atan2(P.y-e.y,P.x-e.x);P.kb.x=Math.cos(a)*3.5;P.kb.y=Math.sin(a)*3.5;}
  }
  G.ents=G.ents.filter(e=>!e.gone);
  // torches
  for(const o of G.map.objs){if(o.type!=='torch'||o.out||!o.shoot)continue;
    if(G.t%(o.shoot===1?90:130)===0&&dist({x:o.x*T,y:o.y*T,w:16,h:16},P)<140){const a=Math.atan2(P.y-o.y*T,P.x-o.x*T);G.shots.push({x:o.x*T+5,y:o.y*T+2,vx:Math.cos(a)*1.3,vy:Math.sin(a)*1.3,life:150});}}
  // shots
  for(const s of G.shots){s.x+=s.vx;s.y+=s.vy;s.life--;if(solidAt(s.x+3,s.y+3))s.life=0;
    const sb={x:s.x,y:s.y,w:6,h:6};
    if(P.atk&&P.atkType==='spear'&&overlap(attackBox(),sb)){s.life=0;puff(s.x+3,s.y+3,'#9cc8ff',4);audio.sfx('douse');continue;}
    if(overlap(sb,P)&&!P.hurt){s.life=0;P.hurt=40;P.toast=Math.min(1,P.toast+0.12);audio.sfx('hurt');G.shake=4;}}
  G.shots=G.shots.filter(s=>s.life>0);
  // radiant heat: being near fire toasts you
  let heat=0;
  for(const e of G.ents){if(e.type!=='enemy'||e.dead)continue;const d=dist(e,P);if(d<e.radius)heat+=e.heat*(1-d/e.radius);}
  for(const o of G.map.objs){if((o.type==='torch'&&!o.out)||(o.type==='firegate'&&!G.flags.gate)||(o.type==='buddy'&&o.cage==='fire'&&!G.freed[o.id])){
    const d=dist({x:o.x*T,y:o.y*T,w:(o.w||1)*T,h:T},P);if(d<28)heat+=0.6*(1-d/28);}}
  const ci=Math.floor((P.x+P.w/2)/T),cj=Math.floor((P.y+P.h/2)/T);
  for(let j=cj-1;j<=cj+1;j++)for(let i=ci-1;i<=ci+1;i++){if(j>=0&&i>=0&&j<G.map.h&&i<G.map.w&&G.map.t[j][i]==='L')heat+=0.5;}
  if(heat>0){P.toast=Math.min(1,P.toast+heat*0.0022);P.heating=true;}else{P.heating=false;P.toast=Math.max(0,P.toast-(G.map.interior?0.004:0.0006));}
  if(P.toast>=1&&!P.melting){P.melting=90;audio.sfx('melt');}
}
function updateMelt(){P.melting--;if(P.melting<=0){P.melting=0;P.toast=0;G.deaths++;startFade(()=>{P.hurt=60;loadMap(G.lastHome.map,G.lastHome.x,G.lastHome.y,0);say(["Puff melted into a puddle... but a fresh coat of glaze put you back together. Try again!"]);});P.melting=0;P.toast=0;}}
function startFade(cb){G.fade=1;G.fadeTo=cb;}

function drawEnts(){const cx=Math.round(G.cam.x),cy=Math.round(G.cam.y);const f=(G.t>>3)&1;

function drawWeapon(x,y,behind){if(!P.atk)return;const spear=P.atkType==='spear';

  ctx.save();ctx.translate(hx,hy);
  if(spear){const prog=1-P.atk/16;const ext=Math.round(14*Math.min(1,prog*2.2)-(prog>0.7?(prog-0.7)*20:0));
    ctx.rotate(base);ctx.drawImage(SPEAR,-8,-16-ext+(P.dir===1?-2:4),16,16);ctx.restore();return;}
  const prog=1-P.atk/14;const sweep=-1.3+prog*2.6;ctx.rotate(base+sweep);
  ctx.drawImage(SWORD,-8,P.dir===1?-19:-15,16,16);ctx.restore();

function text(s,x,y,col='#fffaf0',align='left'){ctx.font='8px "Press Start 2P", monospace';ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='#1a0d12';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function wrap(s,max=27){const out=[];for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){if(w.length>max){if(line)out.push(line);out.push(w.slice(0,max));line=w.slice(max);continue;}
  if((line+' '+w).trim().length>max){out.push(line);line=w;}else line=line?line+' '+w:w;}out.push(line);}return out;}

  for(const k in MAPS)for(const o of MAPS[k].objs){delete o.taken;delete o.talked;delete o.hits;delete o.out;}
  P.toast=0;P.equip='sword';P.melting=0;P.hurt=0;G.lastHome={map:'house0',x:5,y:7};
  loadMap('overworld',24,52,1);G.scene='play';}
function step(){G.t++;
  if(justPressed('mute')){audio.muted=!audio.muted;}
  if(G.scene==='title'){if(justPressed('start')||justPressed('a')){audio.unlock();G.scene='intro';G.introPhase=0;G.introT=0;}pressed.a=0;pressed.b=0;return;}
  if(G.scene==='intro'){G.introT++;if(justPressed('start')){newGame();return;}
    if(justPressed('a')||G.introT>INTRO[G.introPhase].len){if(G.introPhase===3){newGame();return;}G.introPhase++;G.introT=0;}pressed.b=0;return;}
  if(G.scene==='win'){if(justPressed('start')||justPressed('a')){G.scene='title';}return;}
  if(G.fade){G.fade+=G.fadeTo?0.08:-0.08;if(G.fade>=1&&G.fadeTo){const cb=G.fadeTo;G.fadeTo=null;cb();}if(G.fade<=0)G.fade=0;return;}
  if(justPressed('start'))G.paused=!G.paused;if(G.paused)return;
  const goal=goalText();if(goal!==G.goal){G.goal=goal;G.banner={text:goal,t:240};}
  if(G.msg){if(justPressed('a')||justPressed('b')||justPressed('start')){if(G.msgChar<msgTotal())G.msgChar=msgTotal();else nextMsg();}pressed.a=0;pressed.b=0;return;}
  if(P.melting){updateMelt();return;}
  updatePlayer();updateEnemies();updateCam(false);if(G.shake>0)G.shake--;}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);lights=[];
  if(G.scene==='title'){drawTitle();return;}if(G.scene==='intro'){drawIntro();return;}if(G.scene==='win'){drawWin();return;}
  ctx.save();if(G.shake){ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);}
  ctx.beginPath();ctx.rect(0,0,W,H-HUD);ctx.clip();drawMap();drawEnts();drawLights();
  if(G.map.interior||G.mapName==='cave'){ctx.fillStyle=G.mapName==='cave'?'rgba(20,10,40,0.25)':'rgba(255,200,120,0.08)';ctx.fillRect(0,0,W,H);}
  ctx.restore();
  drawHUD();drawMsg();if(!G.msg)drawBanner();
  if(G.paused){ctx.fillStyle='rgba(23,17,28,0.8)';ctx.fillRect(0,0,W,H-HUD);text('PAUSED',W/2,40,'#ffb347','center');text(G.map.name,W/2,56,'#b9a5c6','center');text('Buddies freed: '+freedCount()+'/6',W/2,72,'#fffaf0','center');
    text('GOAL',W/2,100,'#ffb347','center');wrap(G.goal,27).forEach((l,i)=>text(l,W/2,112+i*11,'#fffaf0','center'));text('A sword  B spear  M mute',W/2,170,'#b9a5c6','center');}
  if(G.fade){ctx.fillStyle='rgba(23,17,28,'+Math.min(1,G.fade)+')';ctx.fillRect(0,0,W,H);}}
let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(100,ts-last);last=ts;acc+=dt;while(acc>=1000/60){step();acc-=1000/60;}render();}
function fit(){const wrapEl=document.getElementById('wrap');const touch=document.body.classList.contains('touch');let s=touch?Math.min(wrapEl.clientWidth/W,innerHeight*0.56/H):Math.min(wrapEl.clientWidth/W,wrapEl.clientHeight/H);s=s>=2?Math.floor(s):Math.max(0.9,s);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
if(document.fonts)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(loop);
</script>
