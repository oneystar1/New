<title>Marshmallow Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen arcade cabinet. A 256x224 SNES-size canvas scaled with crisp pixels,
   centered on a dark cabinet background, touch controls under it on phones. Single dark look. */
:root{
  --bg:#17111c; --panel:#241a2c; --line:#4a3756; --fg:#f6ecdc; --muted:#b9a5c6;
  --accent:#ffb347; --fire:#ff5a2b; --mallow:#fff6e8;
  --font-pixel:"Press Start 2P", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-pixel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
#wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;max-width:100%;max-height:100%;
  border:4px solid var(--line);box-shadow:0 0 0 2px #000,0 12px 40px #000c;touch-action:none}
#top{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:center;line-height:1.6}
#top b{color:var(--accent);font-weight:normal}
#pad{display:none;width:100%;max-width:440px;justify-content:space-between;align-items:center;gap:12px;
  margin:auto 0;padding-bottom:env(safe-area-inset-bottom,0px);flex:0 0 auto}
body.touch #pad{display:flex}
body.touch #top{display:none}
body.touch #wrap{align-items:flex-start;flex:0 0 auto}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px}
.mid button{background:var(--panel);border:3px solid var(--line);color:var(--fg);font-family:var(--font-pixel);width:72px;height:30px;border-radius:15px;font-size:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.mid button.on{background:var(--line)}
.stick{position:relative;width:136px;height:136px;border-radius:50%;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 18px #1c1422;touch-action:none;user-select:none;-webkit-user-select:none}
.stick .knob{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:var(--line);border:3px solid var(--muted);box-sizing:border-box;box-shadow:0 3px 0 #000a;pointer-events:none;transition:transform .05s}
.stick.on .knob{background:var(--accent);border-color:#fff}
.stick::before{content:"";position:absolute;left:62px;top:14px;width:12px;height:12px;border-left:3px solid var(--line);border-top:3px solid var(--line);transform:rotate(45deg);opacity:.6}
.btns{position:relative;width:148px;height:136px}
.btns button{position:absolute;background:var(--panel);border:3px solid var(--line);color:var(--fg);
  font-family:var(--font-pixel);font-size:11px;border-radius:50%;width:52px;height:52px;touch-action:none;user-select:none;-webkit-user-select:none}
.btns button:active,.btns button.on{background:var(--line)}
.btns .b{left:0;top:72px;border-color:#5a7fc6}.btns .a{left:88px;top:20px;border-color:var(--fire)}.btns .c{left:52px;top:88px;width:44px;height:44px;border-color:#7cc47a;font-size:8px}.btns .i{left:30px;top:14px;width:44px;height:44px;border-color:#c9a0ff;font-size:8px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (orientation:landscape){
  body.touch{padding-block:4px}
  body.touch #wrap{flex:1 1 auto;align-items:center}
  body.touch #pad{position:fixed;inset:0;margin:0;max-width:none;padding:0 max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));box-sizing:border-box;align-items:flex-end;pointer-events:none;opacity:.85}
  body.touch #pad>*{pointer-events:auto}
  body.touch .mid{position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px))}
  body.touch .stick{width:120px;height:120px}
  body.touch .stick .knob{left:35px;top:35px}
  body.touch .stick::before{left:54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div id="top">Arrows/WASD move &nbsp;·&nbsp; <b>Z</b>/<b>J</b> sword &nbsp;·&nbsp; <b>X</b>/<b>K</b> spear &nbsp;·&nbsp; <b>C</b>/<b>L</b>/<b>Shift</b> roll &nbsp;·&nbsp; <b>V</b>/<b>I</b> item &nbsp;·&nbsp; <b>Enter</b> start/pause &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; gamepad ok</div>
<div id="wrap"><canvas id="c" width="256" height="224" aria-label="Marshmallow Quest game screen"></canvas></div>
<div id="pad">
  <div class="stick" id="stick" aria-label="Joystick"><div class="knob" id="knob"></div></div>
  <div class="mid"><button class="s" data-k="start" aria-label="Start">START</button></div>
  <div class="btns"><button class="b" data-k="b" aria-label="Spear">B</button><button class="c" data-k="c" aria-label="Roll">ROLL</button><button class="i" data-k="item" aria-label="Item">ITEM</button><button class="a" data-k="a" aria-label="Sword">A</button></div>
</div>
<script>
// ===================== MARSHMALLOW QUEST =====================
// A 16-bit top-down adventure. You are Puff, a marshmallow. Your buddies were
// carried off to Ember Keep by the fire monsters. Get too close to fire and you
// toast; toast all the way and you melt. Find the Fire Spear to put flames out.
'use strict';
const W=256,H=224,T=16,HUD=24;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const bctx=buf.getContext('2d');
const snap=document.createElement('canvas');snap.width=W;snap.height=H;const sctx=snap.getContext('2d');

// ---------- input ----------
const keys={up:0,down:0,left:0,right:0,a:0,b:0,c:0,item:0,start:0,mute:0};const released={};
const pressed={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',KeyJ:'a',Space:'a',KeyX:'b',KeyK:'b',KeyC:'c',KeyL:'c',ShiftLeft:'c',ShiftRight:'c',KeyV:'item',KeyI:'item',Enter:'start',Escape:'start',KeyM:'mute'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(!keys[k])pressed[k]=1;keys[k]=1;audio.unlock();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();keys[k]=0;released[k]=1;});
function justReleased(k){const v=released[k];released[k]=0;return !!v;}
function justPressed(k){const v=pressed[k];pressed[k]=0;return !!v;}
const pad=document.getElementById('pad');
function bindBtn(btn){const k=btn.dataset.k;
  const on=e=>{e.preventDefault();btn.classList.add('on');if(!keys[k])pressed[k]=1;keys[k]=1;audio.unlock();};
  const off=e=>{e.preventDefault();btn.classList.remove('on');if(keys[k])released[k]=1;keys[k]=0;};
  btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
  btn.addEventListener('contextmenu',e=>e.preventDefault());}
pad.querySelectorAll('button').forEach(bindBtn);
const joy={x:0,y:0,on:false};
{const st=document.getElementById('stick'),kn=document.getElementById('knob');let pid=null;
  const upd=e=>{const r=st.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width/2-12;const d=Math.hypot(dx,dy);
    if(d>max){dx=dx/d*max;dy=dy/d*max;}kn.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.min(1,d/max);
    if(m<0.18){joy.x=joy.y=0;}else{const a=Math.atan2(dy,dx);const k=(m-0.18)/0.82;joy.x=Math.cos(a)*k;joy.y=Math.sin(a)*k;}
    let dir=null;if(m>0.5)dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');else if(m<0.3)dir=null;else dir=joy.lastDir;
    if(dir&&dir!==joy.lastDir)pressed[dir]=1;joy.lastDir=dir;};
  st.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{st.setPointerCapture(pid);}catch(err){}st.classList.add('on');joy.on=true;audio.unlock();upd(e);});
  st.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e);});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;joy.on=false;joy.x=joy.y=0;joy.lastDir=null;st.classList.remove('on');kn.style.transform='';};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);st.addEventListener('contextmenu',e=>e.preventDefault());}
addEventListener('touchstart',()=>{document.body.classList.add('touch');if(typeof fit==='function')fit();},{once:true,passive:true});
let tapZones=[];
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio.unlock();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  for(const z of tapZones){if(x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h){z.cb();return;}}
  if(typeof G!=='undefined'&&(G.msg||G.scene==='intro'||G.scene==='ending'))pressed.a=1;});
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
// gamepad: standard mapping. Left stick or d-pad moves, A sword, B/Y spear, X roll, Start pauses.
const gp={prev:{}};
function pollGamepad(){if(!navigator.getGamepads)return;const pads=navigator.getGamepads();let g=null;for(const p of pads)if(p&&p.connected){g=p;break;}if(!g)return;
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);const ax=g.axes[0]||0,ay=g.axes[1]||0;
  if(Math.hypot(ax,ay)>0.25){joy.on=true;joy.x=ax;joy.y=ay;gp.joy=true;}else if(gp.joy){joy.on=false;joy.x=joy.y=0;gp.joy=false;}
  const map={a:b(0),b:b(1),item:b(3),c:b(2)||b(4)||b(5),start:b(9),up:b(12),down:b(13),left:b(14),right:b(15)};
  for(const k in map){if(map[k]&&!gp.prev[k]){pressed[k]=1;keys[k]=1;audio.unlock();}else if(!map[k]&&gp.prev[k]){keys[k]=0;released[k]=1;}gp.prev[k]=map[k];}}

// ---------- audio: chiptune synth, sound effects, music sequencer ----------
const NOTE={};{const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];for(let o=1;o<=7;o++)names.forEach((n,i)=>{NOTE[n+o]=440*Math.pow(2,(o-4)+(i-9)/12);});}
const audio={ctx:null,muted:false,music:{track:null,next:0,step:0,timer:null},sizz:null,
  unlock(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=1;this.master.connect(this.ctx.destination);}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();if(this.ctx&&!this.music.timer)this.music.timer=setInterval(()=>this.tick(),90);},
  setMute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:1;},
  tone(f,d,type='square',vol=0.08,slide=0,when=0){if(!this.ctx)return;const t=this.ctx.currentTime+when;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d);},
  noise(d,vol=0.05,hp=800){if(!this.ctx)return;const n=this.ctx.sampleRate*d|0;const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const data=b.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource();s.buffer=b;const f=this.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=this.ctx.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(this.master);s.start();},
  step(surface){if(surface==='stone')this.noise(0.04,0.05,2500);else if(surface==='wood')this.tone(180,0.05,'triangle',0.05,-60);else if(surface==='path')this.noise(0.05,0.035,1200);else this.noise(0.06,0.025,600);},
  drone(level){if(!this.ctx)return;if(!this.dro){const o=this.ctx.createOscillator();o.type='triangle';o.frequency.value=55;const o2=this.ctx.createOscillator();o2.type='sawtooth';o2.frequency.value=55.7;const g=this.ctx.createGain();g.gain.value=0;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=220;o.connect(f);o2.connect(f);f.connect(g);g.connect(this.master);o.start();o2.start();this.dro=g;}
    this.dro.gain.setTargetAtTime(Math.min(0.09,level*0.09),this.ctx.currentTime,0.3);},
  sizzle(level){if(!this.ctx)return;if(!this.sizz){const n=this.ctx.sampleRate*2|0;const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      const s=this.ctx.createBufferSource();s.buffer=b;s.loop=true;const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=3000;f.Q.value=0.8;const g=this.ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(this.master);s.start();this.sizz=g;}
    this.sizz.gain.setTargetAtTime(Math.min(0.12,level*0.12),this.ctx.currentTime,0.08);},
  sfx(n){switch(n){
    case 'sword':this.tone(900,0.08,'square',0.05,-500);this.noise(0.05,0.03,3000);break;
    case 'spear':this.tone(300,0.18,'sawtooth',0.05,900);break;
    case 'hit':this.tone(200,0.1,'square',0.07,-120);this.noise(0.04,0.05,1500);break;
    case 'hurt':this.tone(140,0.25,'sawtooth',0.08,-90);break;
    case 'douse':this.tone(1200,0.3,'triangle',0.07,-900);this.noise(0.25,0.05,4000);break;
    case 'item':[523,659,784,1046].forEach((f,i)=>this.tone(f,0.15,'square',0.06,0,i*0.09));break;
    case 'free':[784,988,1175,1568,1175,1568].forEach((f,i)=>this.tone(f,0.14,'triangle',0.07,0,i*0.08));break;
    case 'glaze':this.tone(660,0.12,'sine',0.06,400);break;
    case 'door':this.tone(220,0.15,'triangle',0.06,-100);break;
    case 'text':this.tone(1500,0.02,'square',0.02);break;
    case 'melt':[400,330,260,180,120].forEach((f,i)=>this.tone(f,0.3,'sawtooth',0.06,-40,i*0.16));break;
    case 'boss':this.tone(90,0.4,'sawtooth',0.1,-40);break;
    case 'roll':this.noise(0.12,0.04,900);this.tone(300,0.1,'triangle',0.03,200);break;
    case 'cut':this.noise(0.08,0.05,1800);this.tone(500,0.06,'square',0.03,-200);break;
    case 'push':this.noise(0.2,0.05,300);break;
    case 'switch':this.tone(400,0.1,'square',0.05);this.tone(600,0.15,'square',0.05,0,0.1);break;
    case 'menu':this.tone(800,0.05,'square',0.04);break;
    case 'coin':this.tone(1300,0.06,'square',0.04);this.tone(1800,0.1,'square',0.04,0,0.06);break;
    case 'freeze':this.tone(1600,0.4,'sine',0.06,-1200);this.noise(0.3,0.04,5000);break;
    case 'steam':this.noise(0.5,0.06,2000);break;
    case 'charge':this.tone(200,0.08,'square',0.03,100);break;
    case 'throw':this.noise(0.1,0.04,1500);this.tone(500,0.15,'triangle',0.04,300);break;
    case 'seal':[659,784,988,1319,1568].forEach((f,i)=>this.tone(f,0.25,'triangle',0.06,0,i*0.1));break;
    case 'splash':this.noise(0.2,0.06,600);this.tone(300,0.2,'sine',0.05,-150);break;
    case 'squeeze':this.tone(250,0.3,'sine',0.05,200);break;
    case 'hop':this.tone(400,0.12,'square',0.04,300);break;

      if(typeof G!=='undefined'&&G.alert&&G.scene==='play'){if(i%2===1)this.noise(0.025,0.035,2600);if(i%4===2)this.tone(70,0.08,'square',0.05,-30,m.next-this.ctx.currentTime);}
      m.next+=beat;m.step++;}},
  play(name){if(this.music.track===name)return;this.music.track=name;this.music.step=0;if(this.ctx)this.music.next=this.ctx.currentTime+0.05;}
};
const TRACKS={
  village:{bpm:132,lead:'square',drums:false,pat:[
    [['E5','-','G5','-','A5','-','G5','E5','D5','-','E5','-','C5','-','-','-'],['C3','.','C3','.','G3','.','G3','.','A3','.','A3','.','E3','.','E3','.']],

}

function mkPlayer(x,y){return{type:'player',x,y,w:10,h:10,dir:0,frame:0,anim:0,toast:0,cap:1,hurt:0,atk:0,atkType:null,speed:1.1,kb:{x:0,y:0},roll:0,rollCd:0,rollDir:{x:0,y:1},idle:0,heating:false,melting:0,pushT:0,equip:'sword',
  soggy:0,charge:0,bTap:-99,spearOut:null,vault:0,hop:null,squeeze:null,carried:null,dotUsed:false,wasToasted:false,gooT:0};}
const P=mkPlayer(0,0);
function mkEnemy(e){const base={type:'enemy',kind:e.kind,x:e.x*T+3,y:e.y*T+3,w:10,h:10,vx:0,vy:0,hurt:0,flash:0,think:0,dead:0,state:'wander',st:0,home:{x:e.x*T+3,y:e.y*T+3},blocked:0};
  switch(e.kind){
    case 'ember':Object.assign(base,{hp:2,speed:0.55,heat:1.0,radius:30,flame:true});break;
    case 'blue':Object.assign(base,{hp:3,speed:0.6,heat:1.1,radius:30,flame:false,blue:true});break;
    case 'candle':Object.assign(base,{hp:4,speed:0.7,heat:0.5,radius:22,flame:true,candle:true});break;
    case 'knight':Object.assign(base,{hp:4,speed:0.8,heat:0.7,radius:24,flame:true});break;
    case 'slime':Object.assign(base,{hp:3,speed:0,heat:0.9,radius:26,flame:true,w:12,h:9,x:e.x*T+2,y:e.y*T+5});break;
    case 'bat':Object.assign(base,{hp:1,speed:0.9,heat:0.8,radius:22,flame:true,fly:true,w:12,h:8,x:e.x*T+2,y:e.y*T+4,ang:Math.random()*6.28});break;
    case 'snail':Object.assign(base,{hp:5,speed:0.25,heat:1.1,radius:26,flame:true,w:14,h:9,x:e.x*T+1,y:e.y*T+5});break;
    case 'toad':Object.assign(base,{hp:8+(hard()?3:0),speed:1.3,heat:1.2,radius:36,flame:false,mini:true,w:20,h:16,x:e.x*T-2,y:e.y*T+4});break;
    case 'boss':Object.assign(base,{hp:9+(hard()?3:0),maxhp:9+(hard()?3:0),speed:0.9,heat:1.6,radius:46,w:22,h:22,x:e.x*T-3,y:e.y*T+2,boss:true,flame:true,phase:0,spit:0});break;}
  base.baseSpeed=base.speed;return base;}
function loadMap(name,tx,ty,dir){const m=MAPS[name];G.map=m;G.mapName=name;G.visited[name]=true;
  G.ents=[];G.shots=[];G.fx=[];G.amb=[];G.patches=[];G.steam=[];G.goo=[];G.frozen={};G.ash=[];P.spearOut=null;P.carried=null;P.vault=0;P.hop=null;P.squeeze=null;P.dotUsed=false;
  if(G.gauntlet&&name!=='castle')G.gauntlet=null;
  if(G.ngplus&&m.ngplus){for(const e of m.ngplus)m.enemies.includes(e)||0;}
  if(G.ngplus&&m.ngPatches)for(const[x,y]of m.ngPatches)G.patches.push({x,y,ttl:1e9});
  for(const o of m.objs){if(o.type==='block'){o.x=o.ox!=null?o.ox:(o.ox=o.x);o.y=o.oy!=null?o.oy:(o.oy=o.y);o.ax=o.ay=0;}}
  const list=m.enemies.concat(hard()&&m.hard?m.hard:[]).concat(G.ngplus&&m.ngplus?m.ngplus:[]);
  for(const e of list){if(e.kind==='boss'&&(G.flags.bossDead||!G.flags.taunt))continue;if(e.kind==='toad'&&G.flags.toadDead)continue;G.ents.push(mkEnemy(e));}
  if(name==='castle'&&G.flags.eastDoor){const b=m.objs.find(o=>o.type==='block');b.x=34;b.y=26;}if(name==='grotto'&&G.flags.grottoEastDoor){const b=m.objs.find(o=>o.type==='block');b.x=22;b.y=15;}
  G.flags.bossFight=G.ents.some(e=>e.boss);
  P.x=tx*T+3;P.y=ty*T+3;P.dir=dir==null?P.dir:dir;P.kb.x=P.kb.y=0;P.atk=0;P.roll=0;P.wasToasted=P.toast/P.cap>=0.5;refreshSolids();
  G.F=G.follower?{id:G.follower,x:P.x,y:P.y+12,w:10,h:10,toast:0,trail:[],parked:false,frame:0}:null;
  if(m.interior){G.lastHome={map:name,x:tx,y:ty};}
  audio.play(G.flags.bossFight&&name==='castle'?'boss':m.music);
  updateCam(true);}
function npcVisible(o){return !o.cond||G.freed[o.cond];}
function refreshSolids(){const m=G.map;const s={};const add=(x,y,w=1)=>{for(let i=0;i<w;i++)s[(x+i)+','+y]=1;};
  for(const o of m.objs){switch(o.type){
    case 'buddy':if(!G.freed[o.id])add(o.x,o.y,o.w||1);break;
    case 'chest':case 'sign':case 'torch':case 'block':case 'shelf':case 'pedestal':case 'trophy':case 'campfire':add(o.x,o.y);break;
    case 'bed':add(o.x,o.y);add(o.x,o.y+1);break;
    case 'curtain':if(P.toast/P.cap<0.5)add(o.x,o.y,o.w);break;
    case 'npc':if(npcVisible(o))add(o.x,o.y);break;
    case 'bush':if(!o.cut)add(o.x,o.y);break;
    case 'firegate':if(!G.flags[o.id])add(o.x,o.y,o.w);break;
    case 'bossdoor':if(freedCount()<5)add(o.x,o.y,o.w);break;
    case 'pdoor':if(!G.flags[o.id+'Door'])add(o.x,o.y,o.w);break;}}
  m.solidObj=s;}
function solidAt(px,py){const m=G.map;const i=Math.floor(px/T),j=Math.floor(py/T);if(i<0||j<0||i>=m.w||j>=m.h)return true;const ch=m.t[j][i];
  if(SOLID.has(ch)&&!(ch==='L'&&G.frozen[i+','+j]>0))return true;if(m.solidObj[i+','+j])return true;if(G.F&&G.F.parked&&G.F.tx===i&&G.F.ty===j)return true;return false;}
function hitsWall(x,y,w,h){return solidAt(x,y)||solidAt(x+w-1,y)||solidAt(x,y+h-1)||solidAt(x+w-1,y+h-1);}
function moveEnt(e,dx,dy){let moved=false;if(dx){const nx=e.x+dx;if(!hitsWall(nx,e.y,e.w,e.h)){e.x=nx;moved=true;}}
  if(dy){const ny=e.y+dy;if(!hitsWall(e.x,ny,e.w,e.h)){e.y=ny;moved=true;}}return moved;}
function slideMove(e,dx,dy){if(dx){if(!moveEnt(e,dx,0)&&!dy){for(const n of[1,-1,2,-2,3,-3]){if(!hitsWall(e.x+dx,e.y+n,e.w,e.h)){e.y+=Math.sign(n);break;}}}}
  if(dy){if(!moveEnt(e,0,dy)&&!dx){for(const n of[1,-1,2,-2,3,-3]){if(!hitsWall(e.x+n,e.y+dy,e.w,e.h)){e.x+=Math.sign(n);break;}}}}}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function dist(a,b){const dx=(a.x+a.w/2)-(b.x+b.w/2),dy=(a.y+a.h/2)-(b.y+b.h/2);return Math.hypot(dx,dy);}
function updateCam(snapNow){const m=G.map;let cx=P.x+P.w/2-W/2,cy=P.y+P.h/2-(H-HUD)/2;
  cx=Math.max(0,Math.min(m.w*T-W,cx));cy=Math.max(0,Math.min(m.h*T-(H-HUD),cy));
  if(m.w*T<W)cx=(m.w*T-W)/2;if(m.h*T<H-HUD)cy=(m.h*T-(H-HUD))/2;
  if(snapNow){G.cam.x=cx;G.cam.y=cy;}else{G.cam.x+=(cx-G.cam.x)*0.2;G.cam.y+=(cy-G.cam.y)*0.2;}}
function say(text,cb,who){const parts=Array.isArray(text)?text:[text];G.msgQ=parts.map(p=>({t:p,who}));G.msgCb=cb||null;nextMsg();}
function puff(x,y,col,n=6){for(let i=0;i<n;i++)G.fx.push({x,y,vx:(Math.random()-0.5)*1.6,vy:(Math.random()-0.9)*1.6,life:20+Math.random()*15,col});}
function startFade(cb,dir){if(dir!=null){sctx.drawImage(cv,0,0);G.trans={t:0,dir};cb();return;}G.fade=1;G.fadeTo=cb;}

const SAVE_KEY='marshmallow-quest-save-3';
function saveGame(){try{const d={flags:G.flags,freed:G.freed,opened:G.opened,q:G.q,taken:G.taken,deaths:G.deaths,lastHome:G.lastHome,cap:P.cap,diff:G.diff,visited:G.visited,
    coins:G.coins,items:G.items,seals:G.seals,follower:G.follower,dayT:G.dayT,opts:G.opts,playT:G.playT,cleared:G.cleared,ngplus:G.ngplus,
    map:G.map.interior?G.mapName:G.lastHome.map,tx:G.map.interior?Math.floor((P.x+5)/T):G.lastHome.x,ty:G.map.interior?Math.floor((P.y+5)/T):G.lastHome.y};
  localStorage.setItem(SAVE_KEY,JSON.stringify(d));G.hasSave=true;}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d||!d.flags)return false;
    Object.assign(G,{flags:d.flags,freed:d.freed,opened:d.opened,q:d.q||{},taken:d.taken||{},deaths:d.deaths||0,lastHome:d.lastHome,diff:d.diff||'normal',visited:d.visited||{},
      coins:d.coins||0,items:d.items||{frost:0,lamp:false,swordLv:1},seals:d.seals||0,follower:d.follower||null,dayT:d.dayT||2600,opts:d.opts||{timer:false,cooling:'normal'},playT:d.playT||0,cleared:!!d.cleared,ngplus:!!d.ngplus});P.cap=d.cap||1;
    G.saved={map:d.map,tx:d.tx,ty:d.ty};return true;}catch(e){return false;}}
function checkSave(){try{G.hasSave=!!localStorage.getItem(SAVE_KEY);}catch(e){G.hasSave=false;}}
function takenKey(o){return G.mapName+':'+o.x+','+o.y;}

// ---------- update: player ----------
function attackBox(){const r=P.atkType==='spear'?26:16;const cx=P.x+P.w/2,cy=P.y+P.h/2;
  if(P.dir===0)return{x:cx-7,y:cy+2,w:14,h:r};if(P.dir===1)return{x:cx-7,y:cy-2-r,w:14,h:r};
  if(P.dir===2)return{x:cx-2-r,y:cy-7,w:r,h:14};return{x:cx+2,y:cy-7,w:r,h:14};}
function dirVec(d){return[[0,1],[0,-1],[-1,0],[1,0]][d];}
function facingTile(n=1){let i=Math.floor((P.x+P.w/2)/T),j=Math.floor((P.y+P.h/2)/T);const d=dirVec(P.dir);return{i:i+d[0]*n,j:j+d[1]*n};}
function objAt(i,j,type){return G.map.objs.find(o=>(!type||o.type===type)&&i>=o.x&&i<o.x+(o.w||1)&&j>=o.y&&j<o.y+(o.h||1)&&(o.type!=='npc'||npcVisible(o)));}
function surfaceAt(){const ch=G.map.t[Math.floor((P.y+P.h)/T)]?.[Math.floor((P.x+P.w/2)/T)];if(ch==='w'||ch==='@'||ch==='S')return'wood';if(ch==='_'||ch==='x'||ch==='c'||ch==='g'||ch==='o')return'stone';if(ch==='p')return'path';if(ch==='s')return'water';return'grass';}
function tileFree(i,j){const m=G.map;const ch=m.t[j]?.[i];if(ch==null)return false;if(SOLID.has(ch)&&!(ch==='L'&&G.frozen[i+','+j]>0))return false;return !m.solidObj[i+','+j];}
function giveCap(n){P.cap+=n;P.toast=Math.max(0,P.toast-0.3);}
function toastRatio(){return P.toast/P.cap;}
function interact(){const f=facingTile();const o=objAt(f.i,f.j);if(!o)return false;
  if(o.type==='sign'){say(o.text,null,'SIGN');return true;}
  if(o.type==='npc'){talk(o);return true;}
  if(o.type==='chest'&&!G.opened[o.id]){if(o.needs&&!G.flags[o.needs]){say(["The chest is sealed by heat. Something nearby is keeping it hot."],null,'CHEST');return true;}
    G.opened[o.id]=true;audio.sfx('item');
    if(o.item==='spear'){G.flags.spear=true;say(["Puff got the FIRE SPEAR! Press B to thrust it. One poke puts any flame out, and a doused cage turns a toasted buddy white again."],null,'ITEM');}
    else if(o.item==='bigjar'){giveCap(0.3);say(["Puff found the ROYAL GLAZE! Your TOAST meter is longer. You can take more heat before melting."],null,'ITEM');}
    else if(o.item==='frost5'){G.items.frost+=5;say(["Five FROST JARS, cold as a cellar. Press V (ITEM) to throw one three steps ahead."],null,'ITEM');}
    else if(o.item==='bigjar2'){giveCap(0.3);say(["Puff found a tub of GROTTO GLAZE! The TOAST meter is longer."],null,'ITEM');}
    else if(o.item==='boots'){G.items.boots=true;say(["Puff found the SUGAR BOOTS! Rolls recover twice as fast and go a little farther."],null,'ITEM');}
    else if(o.item==='frost3'){G.items.frost+=3;say(["Puff found three FROST JARS! Press V (ITEM) to throw one. It freezes lava into a crust you can walk on, and puts out any flame it touches."],null,'ITEM');}
    saveGame();return true;}
  if(o.type==='shelf'&&!G.flags[o.id]){if(!G.F||G.F.parked){say(["A high shelf. Something glints on top, far out of reach. If only someone could give Puff a boost..."],null,'SHELF');return true;}
    G.flags[o.id]=true;giveSeal();say([`Puff climbs onto ${BUDDY_NAMES[G.F.id]}'s head and grabs the MARSHMALLOW SEAL!`],null,'SHELF');return true;}
  if(o.type==='bed'){ask('Sleep until morning?',['Sleep','Not now'],i=>{if(i===0){G.dayT=2600;P.toast=0;P.soggy=0;audio.sfx('glaze');startFade(()=>{say(["Puff sleeps like a log. A soft, white, well-rested log. It is morning."]);saveGame();});}});return true;}
  if(o.type==='pedestal'){if(!G.cleared){say(["A stone pedestal with two empty plinths. An inscription: 'When the Keep is cool, the brave may fight the flames again.'"],null,'PEDESTAL');return true;}
    const best=G.best!=null?'Best time: '+fmtTime(G.best)+'.':'No time set yet.';
    ask('GAUNTLET: Magma Toad, then the Pyre Lord. '+best,['Begin','Not now'],i=>{if(i===0)startGauntlet();});return true;}
  if(o.type==='trophy'){say([o.what==='toadDead'?"A deflated Magma Toad, mounted on a plaque. It still smells faintly of sulfur.":"The Pyre Lord's crown of flame, snuffed and bronzed. The buddies polish it on weekends."],null,'TROPHY');return true;}
  if(o.type==='portrait'){say([`A portrait of ${BUDDY_NAMES[o.who]}, painted the day they came home.`],null,'PORTRAIT');return true;}
  if(o.type==='campfire'){say(["A crackling campfire. Standing close toasts you slowly, and nothing here bites. Useful if you WANT to be brown."],null,'CAMPFIRE');return true;}
  return false;}
const BUDDY_NAMES={fluff:'Fluff',mallo:'Mallo',squish:'Squish',dot:'Dot',bibi:'Bibi',king:'King Mallow'};
const SKILL_TEXT={fluff:"Fluff floats along. Lava and burning trails toast you half as much.",mallo:"Mallo is heavy. Press V (ITEM) on a golden plate to have Mallo stand on it.",squish:"Squish shows you the moves. Rolls go farther, recover faster, and squeezing is quick.",dot:"Dot carries a spare jar. If you would melt, she catches you once per area.",bibi:"Bibi is loud. Nearby monsters chase Bibi instead of you. Watch her toast!"};
function talk(o){const first=!o.talked;o.talked=true;let lines=first?o.lines:o.after||o.lines;
  // rescued buddies in the village can come along
  if(o.cond&&G.freed[o.cond]){const id=o.cond;
    if(G.follower===id){ask(BUDDY_NAMES[id]+' is following you.',['Keep following','Stay here'],i=>{if(i===1){G.follower=null;G.F=null;say([`${BUDDY_NAMES[id]} waves and heads home.`],null,BUDDY_NAMES[id]);saveGame();}});return;}
    say(lines,()=>{ask('Ask '+BUDDY_NAMES[id]+' to come along?',['Come with me','Stay here'],i=>{if(i===0){G.follower=id;G.F={id,x:P.x,y:P.y+12,w:10,h:10,toast:0,trail:[],parked:false,frame:0};say([SKILL_TEXT[id]],null,BUDDY_NAMES[id]);saveGame();}});},o.name);return;}
  if(o.quest==='donut'){if(!G.q.donut){lines=(first?o.lines:[]).concat(["Say, Puff... could you deliver this HONEY DONUT to Granny Sprinkle? The yellow house. She'll know what to do with it."]);G.q.donut=1;}
    else if(G.q.donut===1)lines=["Granny is in the YELLOW donut house, east end of the village. Mind the sprinkles."];}
  if(o.quest==='granny'){if(G.q.donut===1){lines=(first?o.lines:[]).concat(["A honey donut from Crumb! That old softie. Here, dearie, take my GLAZE CHARM. You'll cool down twice as fast."]);G.q.donut=2;G.flags.charm=true;}}
  if(o.quest==='sprinkle'){if(!G.q.sprinkle){G.q.sprinkle=1;}else if(G.q.sprinkle===2){lines=["My SPRINKLE! You found it! Here's Mom's extra-thick glaze, just like she promised. Thanks, Puff!"];G.q.sprinkle=3;}else if(G.q.sprinkle===3)lines=["Lucky sprinkle, lucky me. Thanks again, Puff!"];}
  say(lines,()=>{if(o.gives&&!G.flags[o.gives]){G.flags[o.gives]=true;audio.sfx('item');say(["Puff got the SWORD! Press A to swing it. Hit fire monsters, then back off before you toast."],null,'ITEM');saveGame();return;}
    if(o.heal&&P.toast>0.05){P.toast=0;audio.sfx('glaze');puff(P.x+5,P.y+5,'#fff',10);}
    if(o.quest==='sprinkle'&&G.q.sprinkle===3&&!G.flags.sprinkleReward){G.flags.sprinkleReward=true;giveCap(0.25);audio.sfx('item');say(["Puff's TOAST meter grew! Extra-thick glaze means extra room before melting."],null,'ITEM');saveGame();return;}
    if(o.quest==='granny'&&G.q.donut===2&&!G.flags.charmMsg){G.flags.charmMsg=true;audio.sfx('item');say(["Puff got the GLAZE CHARM! Toast fades twice as fast when you're away from fire."],null,'ITEM');saveGame();return;}
    if(o.quest==='donut'&&G.q.donut===1)saveGame();
    if(o.shop&&!first)shopMenu(o);},o.name);}
function tryPush(dx,dy){const f=facingTile();const b=objAt(f.i,f.j,'block');if(!b)return false;P.pushT++;if(P.pushT<12)return true;
  const nx=b.x+dx,ny=b.y+dy;const m=G.map;if(!tileFree(nx,ny)||objAt(nx,ny,'buddy'))return true;
  b.ax=-dx*16;b.ay=-dy*16;b.x=nx;b.y=ny;P.pushT=0;audio.sfx('push');refreshSolids();
  if(m.t[ny][nx]==='o'){const id=G.mapName==='grotto'?'grottoEastDoor':'eastDoor';if(!G.flags[id]){G.flags[id]=true;audio.sfx('switch');refreshSolids();G.shake=4;say(["The plate sinks with a clunk. Somewhere, a door grinds open."]);saveGame();}}
  return true;}
function trySqueeze(){const f=facingTile();if(G.map.t[f.j]?.[f.i]!=='q')return false;const f2=facingTile(2);if(!tileFree(f2.i,f2.j))return false;
  P.squeeze={t:0,dur:hasFollower('squish')?16:40,fx:P.x,fy:P.y,tx:f2.i*T+3,ty:f2.j*T+3};audio.sfx('squeeze');tip('squeeze','Narrow gaps: Puff squeezes through on his own. Squish makes it quick.');return true;}
function updatePlayer(){
  if(P.hurt>0)P.hurt--;if(P.rollCd>0)P.rollCd--;if(P.soggy>0)P.soggy--;if(P.bossCool>0)P.bossCool--;
  const tt=toastRatio()>=0.5;if(tt!==P.wasToasted){P.wasToasted=tt;refreshSolids();}
  if(P.carried){const b=P.carried;if(b.dead||b.gone||P.carryT++>120||(P.carryT>8&&(justPressed('a')||justPressed('b')||justPressed('c')))){const t=nearestFree(Math.floor((P.x+5)/T),Math.floor((P.y+5)/T));P.x=t.i*T+3;P.y=t.j*T+3;P.carried=null;P.hurt=30;audio.sfx('hop');}
    else{P.x=b.x+1;P.y=b.y+6;}return;}
  if(P.squeeze){const s=P.squeeze;s.t++;const k=s.t/s.dur;P.x=s.fx+(s.tx-s.fx)*k;P.y=s.fy+(s.ty-s.fy)*k;if(s.t>=s.dur){P.x=s.tx;P.y=s.ty;P.squeeze=null;}return;}
  if(P.hop){const h=P.hop;h.t++;const k=h.t/h.dur;P.x=h.fx+(h.tx-h.fx)*k;P.y=h.fy+(h.ty-h.fy)*k;P.z=Math.sin(k*Math.PI)*12;if(h.t>=h.dur){P.x=h.tx;P.y=h.ty;P.hop=null;P.z=0;P.roll=0;}return;}
  if(P.kb.x||P.kb.y){moveEnt(P,P.kb.x,P.kb.y);P.kb.x*=0.8;P.kb.y*=0.8;if(Math.abs(P.kb.x)<0.1)P.kb.x=0;if(Math.abs(P.kb.y)<0.1)P.kb.y=0;}
  if(P.roll>0){P.roll--;const k=(P.roll>10?2.4:1.6)*(hasFollower('squish')?1.3:1)*(G.items.boots?1.15:1);if(G.flags.spear&&P.roll===15)tip('vault','Press B while rolling to VAULT over a gap or lava.');const ox=P.x,oy=P.y;slideMove(P,P.rollDir.x*k,P.rollDir.y*k);P.anim++;
    if(P.roll%3===0)G.fx.push({x:P.x+5,y:P.y+12,vx:-P.rollDir.x*0.4,vy:-0.2,life:12,col:'#ffffff88'});
    // spear vault over the next tile, or roll-vault a single cliff tile
    if(justPressed('b')&&G.flags.spear&&!P.spearOut){const d=P.rollDir;const ti=Math.floor((P.x+5)/T)+Math.round(d.x)*2,tj=Math.floor((P.y+5)/T)+Math.round(d.y)*2;if(tileFree(ti,tj)||G.map.t[tj]?.[ti]==='L'){hopTo(ti,tj,14,true);audio.sfx('hop');return;}}
    if(P.x===ox&&P.y===oy){const di=Math.round(P.rollDir.x),dj=Math.round(P.rollDir.y);if(di||dj){const ci=Math.floor((P.x+5)/T),cj=Math.floor((P.y+5)/T);const ch=G.map.t[cj+dj]?.[ci+di];
      if((ch==='r'||ch==='R')&&tileFree(ci+di*2,cj+dj*2)){hopTo(ci+di*2,cj+dj*2,16,false);audio.sfx('hop');return;}}}
    for(const e of G.ents){if(e.kind==='bat'&&!e.dead&&overlap(e,P)){P.carried=e;P.carryT=0;P.roll=0;audio.sfx('hop');G.banner={title:'HANG ON',text:'Puff grabbed the bat! Any button lets go.',t:150};return;}}
    return;}
  if(G.flags.spear&&!P.spearOut&&G.t-P.bTap<14&&pressed.b){pressed.b=0;P.atk=0;P.atkType=null;P.charge=0;P.bTap=-99;spearThrow();return;}
  if(P.atk>0){P.atk--;if(P.atkType==='spear'&&P.atk>10){const d=dirVec(P.dir);moveEnt(P,d[0]*1.2,d[1]*1.2);}if(P.atk===0)P.atkType=null;if(keys.b&&G.flags.spear)P.charge++;return;}
  // spear: tap B to thrust, tap twice to throw, hold B then release for a frost sweep
  if(G.flags.spear&&!P.spearOut&&keys.b){P.charge++;if(P.charge===20)tip('sweep','Keep holding B, then let go: a FROST SWEEP douses everything around you.');if(P.charge===40){audio.sfx('charge');}if(P.charge>40&&G.t%6===0)G.fx.push({x:P.x+Math.random()*10,y:P.y+10,vx:0,vy:-0.6,life:14,col:'#8fc0ff'});}
  if(justReleased('b')&&G.flags.spear){const c=P.charge;P.charge=0;if(c>=40&&!P.spearOut){frostSweep();return;}}
  if(justPressed('b')){if(G.flags.spear&&!P.spearOut){if(G.t-P.bTap<60)tip('throw','Tap B twice quickly to THROW the spear. It pins a monster and comes back.');P.bTap=G.t;P.atk=16;P.atkType='spear';audio.sfx('spear');hitThings();return;}else if(!G.flags.spear&&!interact()&&G.flags.sword){P.atk=P.soggy?22:14;P.atkType='sword';audio.sfx('sword');hitThings();return;}}
  if(!keys.b)P.charge=0;
  let dx=0,dy=0;if(keys.left)dx=-1;else if(keys.right)dx=1;if(keys.up)dy=-1;else if(keys.down)dy=1;
  if(dx&&dy){dx*=0.7071;dy*=0.7071;}
  if(joy.on&&(joy.x||joy.y)){const m=Math.hypot(joy.x,joy.y);const k=0.45+0.55*Math.min(1,m);dx=joy.x/m*k;dy=joy.y/m*k;}
  const spd=P.speed*(toastRatio()>0.5?0.85:1)*(P.charge>0?0.5:1);
  if(dx||dy){const ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax>ay*1.15)P.dir=dx<0?2:3;else if(ay>ax*1.15)P.dir=dy<0?1:0;
    const ox=P.x,oy=P.y;slideMove(P,dx*spd,dy*spd);P.anim++;P.idle=0;if(P.anim%8===0){P.frame=(P.frame+1)%4;audio.step(surfaceAt());}
    if(P.x===ox&&P.y===oy){const d=dirVec(P.dir);if(!tryPush(d[0],d[1])){P.pushT=0;if(trySqueeze())return;}}else P.pushT=0;
    if(toastRatio()>0.8&&++P.gooT%10===0)G.goo.push({x:P.x+2,y:P.y+8,ttl:240});}
  else{P.anim=0;P.idle++;P.pushT=0;}
  if(justPressed('c')&&P.rollCd===0){let rx=dx,ry=dy;if(!rx&&!ry){const d=dirVec(P.dir);rx=d[0];ry=d[1];}const l=Math.hypot(rx,ry);P.rollDir={x:rx/l,y:ry/l};P.roll=16;P.rollCd=Math.round((hasFollower('squish')?15:30)*(G.items.boots?0.5:1));audio.sfx('roll');return;}
  if(justPressed('a')){if(!interact()&&G.flags.sword){P.atk=P.soggy?22:14;P.atkType='sword';audio.sfx('sword');hitThings();}}
  if(justPressed('item'))useItem();
  const ci=Math.floor((P.x+P.w/2)/T),cj=Math.floor((P.y+P.h/2)/T);
  // shallow water: instant cool-down, soggy for a while
  if(G.map.t[cj]?.[ci]==='s'&&!P.soggy){P.toast=0;P.soggy=600;audio.sfx('splash');puff(P.x+5,P.y+8,'#8fc0ff',10);tip('water','SOGGY: fire cannot toast you for a while, but the sword swings slowly.');}
  if(toastRatio()>=0.5)tip('toasty','Half toasted: slower but tougher. Embers lose interest, and flame curtains let you pass.');
  for(const o of G.map.objs){if(o.type!=='warp')continue;if(o.needs&&!G.flags[o.needs])continue;
    if(ci>=o.x&&ci<o.x+(o.w||1)&&cj>=o.y&&cj<o.y+(o.h||1)){if(!o.silent)audio.sfx('door');const warp=o;startFade(()=>{loadMap(warp.to,warp.tx,warp.ty,warp.dir);saveGame();},warp.dir);return;}}
  for(const o of G.map.objs){if(o.type==='trigger'&&!G.flags['trig_'+o.id]&&ci>=o.x&&ci<o.x+o.w&&cj>=o.y&&cj<o.y+o.h){G.flags['trig_'+o.id]=true;fireTrigger(o.id);}}
  for(const o of G.map.objs){if((o.type==='jar'||o.type==='sprinkle'||o.type==='seal'||o.type==='coin')&&!G.taken[takenKey(o)]&&ci===o.x&&cj===o.y){
      if(o.type==='coin'){G.taken[takenKey(o)]=true;G.coins++;audio.sfx('coin');puff(P.x+5,P.y+5,'#ffd23f',4);continue;}
      if(o.type==='seal'&&G.flags[o.id])continue;
      G.taken[takenKey(o)]=true;
      if(o.type==='jar'){P.toast=Math.max(0,P.toast-0.6);audio.sfx('glaze');puff(P.x+5,P.y+5,'#ffb6d9',8);}
      else if(o.type==='seal'){G.flags[o.id]=true;giveSeal();}
      else{G.q.sprinkle=2;audio.sfx('item');puff(P.x+5,P.y+5,'#ffd23f',10);say(["Puff found the GOLDEN SPRINKLE! Nibs will be thrilled. He's by the village path."],null,'ITEM');saveGame();}}}
  for(const a of G.ash){if(!a.gone&&Math.floor((a.x+5)/T)===ci&&Math.floor((a.y+5)/T)===cj){a.gone=true;puff(a.x+5,a.y+5,'#888',6);}}
}
function tip(id,text){if(G.flags['tip_'+id])return;G.flags['tip_'+id]=true;G.banner={title:'TIP',text,t:300};}
function giveSeal(){G.seals++;giveCap(0.25);audio.sfx('seal');
  const lines=[`Puff found a MARSHMALLOW SEAL! (${G.seals} of 4) The TOAST meter grows.`];if(G.seals===4){giveCap(0.5);lines.push("All four Seals! Puff feels positively fluffy. A big bonus to the TOAST meter.");}
  say(lines,null,'SEAL');saveGame();}
function useItem(){
  if(G.F&&G.F.id==='mallo'){const ci=Math.floor((G.F.x+5)/T),cj=Math.floor((G.F.y+5)/T);const pi=Math.floor((P.x+5)/T),pj=Math.floor((P.y+5)/T);
    const f=facingTile();const spot=G.map.t[f.j]?.[f.i]==='o'?f:G.map.t[pj]?.[pi]==='o'?{i:pi,j:pj}:null;
    if(G.F.parked){G.F.parked=false;say(["Mallo hops off the plate and follows again."],null,'Mallo');refreshSolids();checkPlates();return;}
    if(spot){G.F.parked=true;G.F.tx=spot.i;G.F.ty=spot.j;G.F.x=spot.i*T+3;G.F.y=spot.j*T+3;audio.sfx('push');refreshSolids();checkPlates();return;}}
  if(G.items.frost>0){G.items.frost--;frostThrow();return;}
  if(G.items.lamp)say(["Puff's lamp glows steadily. It lights the way in dark places and on dark nights."],null,'LAMP');
  else say(["Puff has nothing to use. Granny sells Frost Jars, and the Baker sells a lamp."],null,'ITEM');}
function checkPlates(){const m=G.map;if(!(G.F&&G.F.parked&&m.t[G.F.ty]?.[G.F.tx]==='o'))return;
  const id=G.mapName==='castle'&&G.F.tx===31&&G.F.ty===17?'closetDoor':G.mapName==='grotto'&&G.F.tx===24&&G.F.ty===7?'grottoNorthDoor':null;
  if(id&&!G.flags[id]){G.flags[id]=true;audio.sfx('switch');G.shake=4;say(["Mallo plants himself on the plate. A hidden door slides open!"]);refreshSolids();saveGame();}}
function fireTrigger(id){
  if(id==='taunt'){G.flags.taunt=true;const e=G.map.enemies.find(x=>x.kind==='boss');
    say(["So. The little white one who douses my fires.","Your friends made FINE kindling, Puff. Come closer. Let me see how you toast!"],()=>{G.flags.bossFight=true;G.ents.push(mkEnemy(e));audio.play('boss');audio.sfx('boss');G.shake=10;saveGame();},'Pyre Lord');}
  if(id==='toad'){say(["A great wet croak echoes off the stone. The MAGMA TOAD guards the spear!"]);}}
function douseAt(x,y){if(P.soggy){G.steam.push({x,y,r:34,ttl:180});audio.sfx('steam');}}
function damageEnemy(e,dmg,spear){
  if(e.boss){if(!spear){audio.sfx('hit');puff(e.x+11,e.y+11,'#ff8c1a',4);return;}e.hp-=1;e.hurt=30;e.flash=6;G.hitstop=5;audio.sfx('douse');puff(e.x+11,e.y+11,'#9cc8ff',10);G.shake=8;P.bossCool=90;G.steam.push({x:e.x+11,y:e.y+11,r:30,ttl:90});audio.sfx('steam');
    if(e.hp<=0){e.dead=70;if(G.gauntlet){G.gauntlet.stage=3;}else{G.flags.bossDead=true;G.flags.bossFight=false;audio.sfx('win');audio.play('keep');}}return;}
  if(e.mini){e.hp-=dmg;e.hurt=18;e.flash=5;G.hitstop=4;audio.sfx('hit');puff(e.x+10,e.y+8,'#ffd23f',6);G.shake=4;const a=Math.atan2(e.y-P.y,e.x-P.x);e.vx=Math.cos(a)*1.5;e.vy=Math.sin(a)*1.5;
    if(e.hp<=0){e.dead=50;if(G.gauntlet){G.gauntlet.stage=2;G.gauntlet.spawnT=G.t+90;}else{G.flags.toadDead=true;say(["The Magma Toad deflates with a long, sad hiss. The chest in the corner cools and clicks open."]);saveGame();}}return;}
  if(spear&&e.flame){e.hp=0;e.dead=20;audio.sfx('douse');puff(e.x+5,e.y+5,'#9cc8ff',10);douseAt(e.x+5,e.y+5);return;}
  if(spear&&e.blue){audio.sfx('hit');puff(e.x+5,e.y+5,'#3e8cff',3);return;}
  e.hp-=dmg;e.hurt=20;e.flash=5;G.hitstop=3;audio.sfx('hit');puff(e.x+5,e.y+5,'#ffd23f',5);const a=Math.atan2(e.y-P.y,e.x-P.x);e.vx=Math.cos(a)*3;e.vy=Math.sin(a)*3;if(e.hp<=0)e.dead=20;}
function hitThings(){const box=attackBox();const spear=P.atkType==='spear';const dmg=spear?1:G.items.swordLv;
  for(const e of G.ents){if(e.type!=='enemy'||e.dead||e.hurt)continue;if(!overlap(box,e))continue;damageEnemy(e,dmg,spear);}
  for(const o of G.map.objs){
    const ob={x:o.x*T,y:o.y*T,w:(o.w||1)*T,h:T};if(!overlap(box,ob))continue;
    if(o.type==='buddy'&&!G.freed[o.id]){
      if(o.cage==='wood'&&!spear){o.hits=(o.hits||0)+dmg;audio.sfx('hit');puff(ob.x+8,ob.y+8,'#8a5a2a',5);if(o.hits>=3)freeBuddy(o);}
      else if(o.cage==='wood'&&spear){audio.sfx('hit');puff(ob.x+8,ob.y+8,'#8a5a2a',3);}
      else if(o.cage==='fire'){if(spear){freeBuddy(o);douseAt(ob.x+8,ob.y+8);}else{audio.sfx('hit');P.toast=Math.min(P.cap,P.toast+0.08);}}
      else if(o.cage==='boss'&&G.flags.bossDead&&spear)freeBuddy(o);}
    if(o.type==='firegate'&&!G.flags[o.id]){if(spear){G.flags[o.id]=true;audio.sfx('douse');puff(ob.x+16,ob.y+8,'#9cc8ff',16);refreshSolids();say([o.id==='gate'?"The flames hiss and die. The gate of Ember Keep is open!":"The flames gutter out. Cool, sweet air drifts up from the Glaze Grotto."],null,'GATE');saveGame();}else{audio.sfx('hit');P.toast=Math.min(P.cap,P.toast+0.08);}}
    if(o.type==='torch'&&!o.out&&spear){douseTorch(o);}
    if(o.type==='bush'&&!o.cut&&!spear){o.cut=true;audio.sfx('cut');puff(ob.x+8,ob.y+8,'#3fa34d',8);refreshSolids();
      if(o.hides==='jar'&&!G.taken[G.mapName+':'+o.x+','+o.y]){G.map.objs.push({type:'jar',x:o.x,y:o.y,fromBush:true});}
      else if(o.hides==='sprinkle'&&G.q.sprinkle<2&&!G.taken[G.mapName+':'+o.x+','+o.y]){G.map.objs.push({type:'sprinkle',x:o.x,y:o.y});}
      else if(!o.hides&&Math.random()<0.4&&!G.taken[G.mapName+':'+o.x+','+o.y]){G.map.objs.push({type:'coin',x:o.x,y:o.y,fromBush:true});}}
  }}
function douseTorch(o){o.out=true;audio.sfx('douse');puff(o.x*T+8,o.y*T+4,'#9cc8ff',8);douseAt(o.x*T+8,o.y*T+4);
  if(o.id==='brazier'&&!G.flags.westDoor){G.flags.westDoor=true;refreshSolids();G.shake=4;say(["The brazier dies with a gasp. Stone grinds: the west door is open."]);saveGame();}}
function freeBuddy(o){G.freed[o.id]=true;audio.sfx('free');refreshSolids();
  puff(o.x*T+8*(o.w||1),o.y*T+8,'#fff',14);o.freedAt=G.t;const n=freedCount();
  if(o.cage==='boss'){say(["My subjects... and my old friend Puff. Thank you. Ember Keep is ours once more!"],()=>{G.win=true;G.cleared=true;G.scene='ending';G.endT=0;audio.play('ending');G.follower=null;G.F=null;saveGame();},o.name);return;}
  if(o.id!=='king'){giveCap(0.15);}
  const lines=["Puff! You came! I was getting so toasty in there."];
  if(n===5){lines.push("A deep rumble... the throne room door slides open. The Pyre Lord is waiting.");}
  else lines.push(`${6-n} buddies still need rescuing. Puff feels a little tougher: the TOAST meter grew!`);
  say(lines,null,o.name);saveGame();}

// ---------- update: enemies, hazards, heat ----------
function hurtPlayer(amt,from,kb=3.5){if(P.hurt||P.roll||P.carried||P.hop||P.vault)return;
  if(P.soggy)amt*=0.3;if(toastRatio()>0.5)amt*=0.6;
  P.hurt=40;P.toast=Math.min(P.cap,P.toast+amt);audio.sfx('hurt');G.shake=5;
  if(from){const a=Math.atan2(P.y+P.h/2-(from.y+from.h/2),P.x+P.w/2-(from.x+from.w/2));P.kb.x=Math.cos(a)*kb;P.kb.y=Math.sin(a)*kb;}}
function target(e){if(G.F&&G.F.id==='bibi'&&!G.F.parked&&dist(e,G.F)<70)return G.F;return P;}
function wander(e){e.think--;if(e.think<0){e.think=40+Math.random()*60;const a=Math.random()*6.28;const go=Math.random()<0.7;e.vx=go?Math.cos(a)*e.speed*0.6:0;e.vy=go?Math.sin(a)*e.speed*0.6:0;}
  if((e.vx||e.vy)&&!moveEnt(e,e.vx,e.vy)){const a=Math.random()*6.28;e.vx=Math.cos(a)*e.speed*0.6;e.vy=Math.sin(a)*e.speed*0.6;e.think=30;}}
function chase(e,sp,tg){tg=tg||target(e);const a=Math.atan2(tg.y+tg.h/2-(e.y+e.h/2),tg.x+tg.w/2-(e.x+e.w/2));
  if(e.blocked>0){e.blocked--;moveEnt(e,Math.cos(e.bA)*sp,Math.sin(e.bA)*sp);return;}
  if(!moveEnt(e,Math.cos(a)*sp,Math.sin(a)*sp)){e.blocked=20;e.bA=a+(Math.random()<0.5?1:-1)*Math.PI/2;}}
function updateEnemy(e){const tg=target(e);const d=dist(e,tg);e.st++;const calm=inSteam(e);
  const ignore=(e.kind==='ember'||e.kind==='blue')&&tg===P&&toastRatio()>0.6; // embers leave well-toasted marshmallows alone
  switch(e.kind){
    case 'ember':case 'blue':
      if(calm||ignore){wander(e);e.state='wander';break;}
      if(e.state==='wander'){wander(e);if(d<48){e.state='windup';e.st=0;}}
      else if(e.state==='windup'){if(e.st>28){e.state='lunge';e.st=0;const a=Math.atan2(tg.y-e.y,tg.x-e.x);const k=2.2*(G.mapName==='overworld'&&nightAmount()>0.5?1.3:1);e.vx=Math.cos(a)*k;e.vy=Math.sin(a)*k;}}
      else if(e.state==='lunge'){if(!moveEnt(e,e.vx,e.vy)||e.st>16){e.state='cool';e.st=0;}}
      else if(e.state==='cool'){if(e.st>40){e.state=d<80?'windup':'wander';e.st=0;}if(d>24)chase(e,e.speed*0.5,tg);}break;
    case 'knight':
      if(calm){wander(e);e.state='wander';break;}
      if(e.state==='wander'){wander(e);if(d<90){e.state='chase';e.st=0;}}
      else if(e.state==='chase'){chase(e,e.speed,tg);if(d<26){e.state='windup';e.st=0;e.sw=tg.x+tg.w/2>e.x+e.w/2?1:-1;}else if(d>120){e.state='wander';}}
      else if(e.state==='windup'){if(e.st>22){e.state='swing';e.st=0;audio.sfx('sword');}}
      else if(e.state==='swing'){const sb=swingBox(e);if(e.st<10){if(overlap(sb,P))hurtPlayer(0.14,e,4);if(G.F&&overlap(sb,G.F))G.F.toast+=0.15;}if(e.st>18){e.state='chase';e.st=0;}}break;
    case 'candle':{ // patrols the gallery, relighting doused torches
      const outT=G.map.objs.filter(o=>o.type==='torch'&&o.out&&!o.big);let best=null,bd=1e9;for(const o of outT){const dd=Math.hypot(o.x*T-e.x,o.y*T-e.y);if(dd<bd){bd=dd;best=o;}}
      if(best&&!calm){const a=Math.atan2(best.y*T+4-e.y,best.x*T+3-e.x);if(bd>14)chase(e,e.speed,{x:best.x*T+3,y:best.y*T+3,w:10,h:10});else{best.out=false;puff(best.x*T+8,best.y*T,'#ffd23f',8);audio.sfx('sword');}}
      else if(d<60&&!calm)chase(e,e.speed*0.8,tg);else wander(e);break;}
    case 'slime':
      if(e.state==='wander'){if(e.st>50){e.state='hop';e.st=0;const a=d<100&&!calm?Math.atan2(tg.y-e.y,tg.x-e.x):Math.random()*6.28;e.vx=Math.cos(a)*1.4;e.vy=Math.sin(a)*1.4;}}
      else if(e.state==='hop'){e.z=Math.sin(e.st/22*Math.PI)*8;if(!moveEnt(e,e.vx,e.vy)){e.vx*=-0.5;e.vy*=-0.5;}if(e.st>22){e.state='wander';e.st=0;e.z=0;}}break;
    case 'bat':{e.ang+=0.08;const carrying=P.carried===e;
      if(carrying){e.x+=Math.cos(e.ang)*1.6;e.y+=Math.sin(e.ang*1.7)*1.2;}
      else if(e.state==='wander'){const a=Math.atan2(tg.y-e.y,tg.x-e.x);e.x+=Math.cos(e.ang)*0.9+(d<110&&!calm?Math.cos(a)*0.25:0);e.y+=Math.sin(e.ang*1.7)*0.7+(d<110&&!calm?Math.sin(a)*0.25:0);
        if(d<70&&!calm&&(Math.abs(tg.x-e.x)<6||Math.abs(tg.y-e.y)<6)&&e.st>60){e.state='dive';e.st=0;const b=Math.atan2(tg.y-e.y,tg.x-e.x);e.vx=Math.cos(b)*2.6;e.vy=Math.sin(b)*2.6;}}
      else{e.x+=e.vx;e.y+=e.vy;if(e.st>22){e.state='wander';e.st=0;}}
      e.x=Math.max(16,Math.min(G.map.w*T-32,e.x));e.y=Math.max(16,Math.min(G.map.h*T-32,e.y));break;}
    case 'snail':
      if(d<120&&!calm)chase(e,e.speed,tg);else wander(e);
      if(e.st%34===0){G.patches.push({x:Math.floor((e.x+e.w/2)/T),y:Math.floor((e.y+e.h/2)/T),ttl:320});}break;
    case 'toad':
      if(e.state==='wander'){if(e.st>45){e.state='hop';e.st=0;const a=Math.atan2(tg.y-e.y,tg.x-e.x);e.vx=Math.cos(a)*e.speed;e.vy=Math.sin(a)*e.speed;}
        if(e.st===20&&d<150&&!calm){for(let k=-1;k<=1;k++){const a=Math.atan2(tg.y-e.y,tg.x-e.x)+k*0.3;G.shots.push({x:e.x+8,y:e.y+4,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,life:110});}audio.sfx('boss');}}
      else if(e.state==='hop'){e.z=Math.sin(e.st/24*Math.PI)*10;if(!moveEnt(e,e.vx,e.vy)){e.vx=0;e.vy=0;}if(e.st>24){e.state='wander';e.st=0;e.z=0;G.shake=3;}}break;
    case 'boss':{e.phase++;const a=Math.atan2(tg.y-e.y,tg.x-e.x);const p2=e.hp<=Math.ceil(e.maxhp/2);G.bossPhase=p2?2:1;const sp=e.speed*(p2?1.35:1);
      if(e.phase%180<100){chase(e,sp,tg);}
      else{moveEnt(e,Math.cos(a+Math.PI/2)*sp,Math.sin(a+Math.PI/2)*sp);
        if(e.phase%30===0&&!calm){for(let k=-1;k<=1;k++){const b=a+k*0.35;G.shots.push({x:e.x+8,y:e.y+8,vx:Math.cos(b)*1.6,vy:Math.sin(b)*1.6,life:120});}audio.sfx('boss');}}
      if(p2){if(e.phase%120===0){for(let k=0;k<8;k++){const b=k*Math.PI/4+e.phase/50;G.shots.push({x:e.x+8,y:e.y+8,vx:Math.cos(b)*1.3,vy:Math.sin(b)*1.3,life:140});}audio.sfx('boss');G.shake=6;}
        if(e.phase%240===0&&G.ents.filter(x=>x.kind==='ember'&&!x.dead).length<3){G.ents.push(mkEnemy({kind:'ember',x:Math.floor(e.x/T),y:Math.floor(e.y/T)+1}));}}
      break;}
  }}
// any lit fire in view keeps Puff from cooling down
function fireOnScreen(){const cx=G.cam.x-16,cy=G.cam.y-16,cw=W+32,ch=H+32;const inView=(x,y)=>x>=cx&&x<cx+cw&&y>=cy&&y<cy+ch;
  for(const e of G.ents){if(e.type==='enemy'&&!e.dead&&(e.flame||e.blue||e.boss||e.mini)&&inView(e.x,e.y))return true;}
  for(const o of G.map.objs){if(((o.type==='torch'&&!o.out)||(o.type==='firegate'&&!G.flags[o.id])||(o.type==='buddy'&&o.cage==='fire'&&!G.freed[o.id])||(o.type==='vent'&&o.on)||o.type==='campfire'||o.type==='curtain')&&inView(o.x*T,o.y*T))return true;}
  for(const p of G.patches)if(inView(p.x*T,p.y*T))return true;
  const i0=Math.max(0,Math.floor(cx/T)),j0=Math.max(0,Math.floor(cy/T));for(let j=j0;j<j0+16&&j<G.map.h;j++)for(let i=i0;i<i0+19&&i<G.map.w;i++){if(G.map.t[j][i]==='L'&&!(G.frozen[i+','+j]>0))return true;}
  return false;}
function swingBox(e){const r=14;return e.sw>0?{x:e.x+e.w-2,y:e.y-4,w:r,h:e.h+8}:{x:e.x-r+2,y:e.y-4,w:r,h:e.h+8};}
function nearLava(x,y){const i=Math.floor(x/T),j=Math.floor(y/T);for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)if(G.map.t[j+b]?.[i+a]==='L')return true;return false;}
function updateEnemies(){
  for(const e of G.ents){if(e.type!=='enemy')continue;
    if(e.flash)e.flash--;
    e.speed=e.baseSpeed*(inGoo(e)?0.4:1)*(e.kind==='ember'&&G.mapName==='overworld'&&nightAmount()>0.5?1.3:1);
    if(e.dead){e.dead--;if(e.dead<=0){e.gone=true;if(!e.boss&&!e.mini){const tx=Math.floor((e.x+e.w/2)/T),ty=Math.floor((e.y+e.h/2)/T);const r=Math.random();
        if(r<0.1)G.map.objs.push({type:'jar',x:tx,y:ty,drop:G.t});else if(r<0.55)G.map.objs.push({type:'coin',x:tx,y:ty,drop:G.t});
        if((e.kind==='ember'||e.kind==='blue')&&nearLava(e.x+5,e.y+5))G.ash.push({x:e.x,y:e.y,t:0,kind:e.kind});}}continue;}
    if(e.pinned>0){e.pinned--;if(e.pinned%8===0)puff(e.x+5,e.y,'#8fc0ff',1);continue;}
    if(e.hurt){e.hurt--;moveEnt(e,e.vx,e.vy);e.vx*=0.8;e.vy*=0.8;continue;}
    updateEnemy(e);
    if(overlap(e,P)&&!(e.kind==='slime'&&e.z>3)&&P.carried!==e)hurtPlayer(e.boss?0.25:e.mini?0.2:0.15,e);
    if(G.F&&!G.F.parked&&overlap(e,G.F)&&G.t%20===0)G.F.toast+=0.2;
  }
  G.ents=G.ents.filter(e=>!e.gone);
  // ash left near lava reignites unless stepped on
  for(const a of G.ash){a.t++;if(!a.gone&&a.t>240){a.gone=true;G.ents.push(mkEnemy({kind:a.kind,x:Math.floor((a.x+5)/T),y:Math.floor((a.y+5)/T)}));puff(a.x+5,a.y+5,'#ff8c1a',10);}}
  G.ash=G.ash.filter(a=>!a.gone);
  for(const o of G.map.objs){if(o.type==='torch'&&!o.out&&o.shoot){
      if(G.t%(o.shoot===1?90:130)===0&&dist({x:o.x*T,y:o.y*T,w:16,h:16},P)<140){const a=Math.atan2(P.y-o.y*T,P.x-o.x*T);G.shots.push({x:o.x*T+5,y:o.y*T+2,vx:Math.cos(a)*1.3,vy:Math.sin(a)*1.3,life:150});}}
    if(o.type==='vent'){o.on=((G.t+o.phase)%120)<50;o.warn=!o.on&&((G.t+o.phase)%120)>=100;if(o.on&&overlap({x:o.x*T+2,y:o.y*T+2,w:12,h:12},P))hurtPlayer(0.16,null);}
    if(o.type==='curtain'&&toastRatio()<0.5&&overlap({x:o.x*T,y:o.y*T-4,w:o.w*T,h:20},P))hurtPlayer(0.12,{x:o.x*T+o.w*8-5,y:o.y*T-5,w:10,h:10},3);}
  for(const p of G.patches){p.ttl--;if(p.ttl>0&&overlap({x:p.x*T+3,y:p.y*T+3,w:10,h:10},P))hurtPlayer(hasFollower('fluff')?0.05:0.1,null,1.5);}
  G.patches=G.patches.filter(p=>p.ttl>0);
  for(const s of G.shots){s.x+=s.vx;s.y+=s.vy;s.life--;if(solidAt(s.x+3,s.y+3)&&!G.map.solidObj[Math.floor((s.x+3)/T)+','+Math.floor((s.y+3)/T)])s.life=0;
    const sb={x:s.x,y:s.y,w:6,h:6};
    if(P.atk&&P.atkType==='spear'&&overlap(attackBox(),sb)){s.life=0;puff(s.x+3,s.y+3,'#9cc8ff',4);audio.sfx('douse');continue;}
    if(overlap(sb,P)&&!P.hurt&&!P.roll){s.life=0;hurtPlayer(0.12,s,2);}
    if(G.F&&!G.F.parked&&overlap(sb,G.F)){s.life=0;G.F.toast+=0.1;}}
  G.shots=G.shots.filter(s=>s.life>0);
  // radiant heat
  let heat=0;const lavaMul=hasFollower('fluff')?0.5:1;
  for(const e of G.ents){if(e.type!=='enemy'||e.dead)continue;if(e.boss&&P.bossCool>0)continue;const d=dist(e,P);if(d<e.radius)heat+=e.heat*(1-d/e.radius);}
  for(const o of G.map.objs){if((o.type==='torch'&&!o.out)||(o.type==='firegate'&&!G.flags[o.id])||(o.type==='buddy'&&o.cage==='fire'&&!G.freed[o.id])||(o.type==='vent'&&o.on)||o.type==='campfire'||(o.type==='curtain'&&toastRatio()>=0.5)){
    const d=dist({x:o.x*T,y:o.y*T,w:(o.w||1)*T,h:T},P);if(d<28)heat+=0.6*(1-d/28);}}
  for(const p of G.patches){const d=dist({x:p.x*T,y:p.y*T,w:T,h:T},P);if(d<22)heat+=0.5*(1-d/22)*lavaMul;}
  const ci=Math.floor((P.x+P.w/2)/T),cj=Math.floor((P.y+P.h/2)/T);
  for(let j=cj-1;j<=cj+1;j++)for(let i=ci-1;i<=ci+1;i++){if(j>=0&&i>=0&&j<G.map.h&&i<G.map.w&&G.map.t[j][i]==='L'&&!(G.frozen[i+','+j]>0))heat+=0.5*lavaMul;}
  heat*=G.map.heat*(hard()?1.4:1);
  if(P.soggy||P.carried||P.hop)heat=0;
  if(heat>0){P.toast=Math.min(P.cap,P.toast+heat*0.0022);P.heating=true;}
  else{P.heating=false;if(G.opts.cooling!=='jars'||G.map.interior){const rate=G.map.interior?0.004:(G.fireNear?0:0.0003);P.toast=Math.max(0,P.toast-rate*(G.flags.charm?2:1));}}
  if(G.t%10===0)G.fireNear=fireOnScreen();
  audio.sizzle(P.heating?0.4+heat*0.3:0);audio.drone(toastRatio()>0.6?(toastRatio()-0.6)/0.4:0);
  G.alert=G.ents.some(e=>e.type==='enemy'&&!e.dead&&dist(e,P)<110&&(e.boss||e.mini||e.state==='windup'||e.state==='lunge'||e.state==='dive'||e.state==='swing'));
  if(P.toast>=P.cap&&!P.melting){
    if(hasFollower('dot')&&!P.dotUsed){P.dotUsed=true;P.toast=P.cap*0.3;P.hurt=60;audio.sfx('glaze');puff(P.x+5,P.y+5,'#ffb6d9',14);say(["Dot smashes her spare jar over Puff just in time! 'That was my only one, so be careful!'"],null,'Dot');}
    else{P.melting=90;audio.sfx('melt');audio.sizzle(0);}}
  updateFollower();updateAmbience();
}
function updateAmbience(){const m=G.map;const cx=G.cam.x,cy=G.cam.y;
  if(G.mapName==='overworld'&&cy<40*T&&G.t%14===0){const k=Math.random()*3|0;G.amb.push({kind:'leaf',s:k,x:cx+Math.random()*W,y:cy-8,vx:0.3+Math.random()*0.4,vy:0.35+Math.random()*0.3,life:400,ph:Math.random()*6});}
  if(G.mapName==='castle'&&G.t%10===0){G.amb.push({kind:'dust',x:cx+Math.random()*W,y:cy+Math.random()*(H-HUD),vx:(Math.random()-0.5)*0.1,vy:-0.05-Math.random()*0.08,life:300,ph:Math.random()*6});}
  if(G.t%6===0){const i0=Math.floor(cx/T),j0=Math.floor(cy/T);for(let j=j0;j<j0+13;j++)for(let i=i0;i<i0+17;i++){if(m.t[j]?.[i]==='L'&&!(G.frozen[i+','+j]>0)&&Math.random()<0.08)G.amb.push({kind:'heat',x:i*T+Math.random()*16,y:j*T+8,vx:0,vy:-0.4,life:40,ph:Math.random()*6});}}
  for(const a of G.amb){a.life--;a.ph+=0.05;a.x+=a.vx+(a.kind==='leaf'?Math.sin(a.ph)*0.4:a.kind==='heat'?Math.sin(a.ph*3)*0.3:0);a.y+=a.vy;}
  G.amb=G.amb.filter(a=>a.life>0&&a.y<cy+H&&a.y>cy-20);if(G.amb.length>80)G.amb.splice(0,G.amb.length-80);}
function updateMelt(){P.melting--;if(P.melting<=0){P.melting=0;P.toast=0;G.deaths++;G.flags.bossFight=false;G.gauntlet=null;
  startFade(()=>{P.hurt=60;loadMap(G.lastHome.map,G.lastHome.x,G.lastHome.y,0);say(["Puff melted into a puddle... but a fresh coat of glaze put you back together. Try again!"]);saveGame();});}}

// ---------- mechanics: choices, shops, followers, items, world clock, gauntlet ----------
function ask(title,opts,cb){G.choice={title,opts,idx:0,cb};pressed.up=0;pressed.down=0;pressed.a=0;pressed.b=0;}
function hasFollower(id){return !!(G.F&&G.F.id===id&&!G.F.parked);}
function nightAmount(){const t=(G.dayT%14400)/14400;return t<0.5?0:t<0.6?(t-0.5)/0.1:t<0.9?1:1-(t-0.9)/0.1;}
function fmtTime(f){const s=Math.floor(f/60);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function inSteam(e){const cx=e.x+e.w/2,cy=e.y+e.h/2;return G.steam.some(s=>Math.hypot(s.x-cx,s.y-cy)<s.r);}
function inGoo(e){return G.goo.some(g=>overlap({x:g.x,y:g.y,w:12,h:8},e));}
function nearestFree(i,j){if(tileFree(i,j))return{i,j};for(let r=1;r<6;r++)for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++){if(Math.max(Math.abs(a),Math.abs(b))!==r)continue;if(tileFree(i+a,j+b))return{i:i+a,j:j+b};}return{i,j};}
function hopTo(ti,tj,dur,noHeat){P.hop={t:0,dur,fx:P.x,fy:P.y,tx:ti*T+3,ty:tj*T+3};P.roll=0;}
function shopMenu(o){if(nightAmount()>0.5){say(["We're closed for the night, dearie. Come back in the morning, or sleep it off at home."],null,o.name);return;}
  const items=o.shop.filter(it=>!(it.once&&G.items[it.id])&&!(it.id==='glaze'&&(G.items.glazeBought||0)>=3));if(!items.length){say(["Nothing left to sell you today!"],null,o.name);return;}
  ask(`Buy something? You have ${G.coins} sprinkles.`,items.map(it=>`${it.name} (${it.price})`).concat(['Nothing']),i=>{if(i<0||i>=items.length)return;const it=items[i];
    if(G.coins<it.price){say(["Not enough sprinkles, I'm afraid. Monsters and bushes drop them."],null,o.name);return;}
    G.coins-=it.price;audio.sfx('item');
    if(it.id==='frost'){G.items.frost++;say(["One FROST JAR. Press V (ITEM) to throw it. Freezes lava into a crust and snuffs any flame, even the blue ones."],null,o.name);}
    else if(it.id==='lamp'){G.items.lamp=true;say(["A sturdy LAMP. Dark caves and dark nights will be a lot friendlier now."],null,o.name);}
    else if(it.id==='glaze'){G.items.glazeBought=(G.items.glazeBought||0)+1;giveCap(0.1);say(["Honey glaze, fresh from the oven. Your TOAST meter grows a little."],null,o.name);}
    else if(it.id==='swordlv'){G.items.swordLv=2;say(["There. Sharp enough to split a sprinkle. Your sword now hits twice as hard."],null,o.name);}
    saveGame();});}
function updateFollower(){const F=G.F;if(!F)return;F.frame++;
  if(F.parked){F.toast=Math.max(0,F.toast-0.002);return;}
  F.trail.push({x:P.x,y:P.y});if(F.trail.length>14)F.trail.shift();
  const d=Math.hypot(P.x-F.x,P.y-F.y);if(d>120){F.x=P.x;F.y=P.y+12;F.trail=[];}
  else if(d>16){const t=F.trail[0];F.x+=(t.x-F.x)*0.25;F.y+=(t.y-F.y)*0.25;}
  let heat=0;for(const e of G.ents){if(e.type!=='enemy'||e.dead)continue;const dd=dist(e,F);if(dd<e.radius)heat+=e.heat*(1-dd/e.radius);}
  const ci=Math.floor((F.x+5)/T),cj=Math.floor((F.y+5)/T);for(let j=cj-1;j<=cj+1;j++)for(let i=ci-1;i<=ci+1;i++){if(G.map.t[j]?.[i]==='L'&&!(G.frozen[i+','+j]>0))heat+=F.id==='fluff'?0:0.5;}
  F.heating=heat>0;if(heat>0)F.toast=Math.min(1,F.toast+heat*0.002*G.map.heat);else F.toast=Math.max(0,F.toast-0.001);
  if(F.toast>=1){const n=BUDDY_NAMES[F.id];G.follower=null;G.F=null;say([`${n} is too toasty to go on! "S-sorry Puff, I'm heading home to cool off!"`],null,n);saveGame();}}
function frostThrow(){const d=dirVec(P.dir);P.frostProj={x:P.x+3,y:P.y+2,vx:d[0]*3,vy:d[1]*3,t:0};audio.sfx('throw');}
function frostLand(x,y){const i=Math.floor(x/T),j=Math.floor(y/T);for(const[a,b]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){if(G.map.t[j+b]?.[i+a]==='L')G.frozen[(i+a)+','+(j+b)]=360;}
  for(const e of G.ents){if(e.type==='enemy'||e.dead)if(!e.boss&&!e.mini&&(e.flame||e.blue)&&Math.hypot(e.x+5-x,e.y+5-y)<26){e.hp=0;e.dead=20;puff(e.x+5,e.y+5,'#8fc0ff',8);}}
  G.shots=G.shots.filter(s=>Math.hypot(s.x-x,s.y-y)>30);
  for(const o of G.map.objs)if(o.type==='torch'&&!o.out&&Math.hypot(o.x*T+8-x,o.y*T+4-y)<26)douseTorch(o);
  for(let k=0;k<14;k++)G.fx.push({x,y,vx:Math.cos(k/14*6.28)*1.5,vy:Math.sin(k/14*6.28)*1.5,life:18,col:'#bfefff'});audio.sfx('freeze');refreshSolids();}
function frostSweep(){const cx=P.x+5,cy=P.y+5;P.atk=12;P.atkType='sweep';P.toast=Math.min(P.cap,P.toast+0.15);
  for(const e of G.ents){if(e.type!=='enemy'||e.dead||e.boss||e.mini)continue;if((e.flame||e.blue)&&dist(e,P)<44){e.hp=0;e.dead=20;puff(e.x+5,e.y+5,'#8fc0ff',8);douseAt(e.x+5,e.y+5);}}
  for(const o of G.map.objs)if(o.type==='torch'&&!o.out&&Math.hypot(o.x*T+8-cx,o.y*T+4-cy)<44)douseTorch(o);

function spearThrow(){const d=dirVec(P.dir);P.spearOut={x:P.x+3,y:P.y+2,vx:d[0]*3.5,vy:d[1]*3.5,t:0,ret:false,dir:P.dir};audio.sfx('throw');}
function updateMechanics(){
  if(G.scene==='play'&&!G.paused){G.dayT=(G.dayT+1)%14400;G.playT++;}
  for(const s of G.steam)s.ttl--;G.steam=G.steam.filter(s=>s.ttl>0);
  for(const g of G.goo)g.ttl--;G.goo=G.goo.filter(g=>g.ttl>0);
  let thaw=false;for(const k in G.frozen){G.frozen[k]--;if(G.frozen[k]<=0){delete G.frozen[k];thaw=true;}}if(thaw)refreshSolids();
  if(P.spearOut){const s=P.spearOut;s.t++;
    if(!s.ret){s.x+=s.vx;s.y+=s.vy;if(s.t>40||solidAt(s.x+5,s.y+5)&&!G.map.solidObj[Math.floor((s.x+5)/T)+','+Math.floor((s.y+5)/T)])s.ret=true;
      const sb={x:s.x,y:s.y,w:10,h:10};
      for(const e of G.ents){if(e.type==='enemy'||!e.dead)if(!e.dead&&!e.pinned&&(e.flame||e.blue)&&!e.boss&&overlap(sb,e)){e.pinned=120;e.vx=e.vy=0;puff(e.x+5,e.y+5,'#8fc0ff',6);audio.sfx('douse');s.ret=true;}}
      for(const o of G.map.objs)if(o.type==='torch'&&!o.out&&overlap(sb,{x:o.x*T,y:o.y*T-6,w:16,h:20}))douseTorch(o);
      for(const sh of G.shots)if(overlap(sb,{x:sh.x,y:sh.y,w:6,h:6})){sh.life=0;puff(sh.x+3,sh.y+3,'#9cc8ff',3);}}
    else{const dx=P.x+3-s.x,dy=P.y+2-s.y;const d=Math.hypot(dx,dy);if(d<6){P.spearOut=null;}else{s.x+=dx/d*4;s.y+=dy/d*4;}}}
  if(P.frostProj){const f=P.frostProj;f.t++;f.x+=f.vx;f.y+=f.vy;if(f.t>=16||solidAt(f.x+5,f.y+5)&&G.map.t[Math.floor((f.y+5)/T)]?.[Math.floor((f.x+5)/T)]!=='L'){frostLand(f.x+5,f.y+5);P.frostProj=null;}}
  if(G.gauntlet)updateGauntlet();}
function startGauntlet(){G.gauntlet={stage:1,t:0,spawnT:G.t+60};G.ents=G.ents.filter(e=>!e.boss&&!e.mini);say(["The plinths glow. Something heavy lands behind you..."]);}
function updateGauntlet(){const g=G.gauntlet;g.t++;
  if(g.stage===1&&g.spawnT&&G.t>=g.spawnT){g.spawnT=0;G.ents.push(mkEnemy({kind:'toad',x:35,y:9}));audio.sfx('boss');G.shake=6;}
  if(g.stage===2&&g.spawnT&&G.t>=g.spawnT){g.spawnT=0;const b=mkEnemy({kind:'boss',x:35,y:7});G.ents.push(b);G.flags.bossFight=true;audio.play('boss');audio.sfx('boss');G.shake=10;}
  if(g.stage===3){const t=g.t;const best=G.best==null||t<G.best;if(best){G.best=t;try{localStorage.setItem('marshmallow-quest-best',String(t));}catch(e){}}
    G.gauntlet=null;G.flags.bossFight=false;audio.play('keep');say([`Gauntlet cleared in ${fmtTime(t)}!`+(best?' A new best time!':' Best: '+fmtTime(G.best)+'.')],null,'GAUNTLET');}}

function dawnSky(k){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${13+k*120|0},${10+k*90|0},${42+k*120|0})`);g.addColorStop(1,`rgb(${42+k*213|0},${26+k*150|0},${72+k*60|0})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`rgba(255,220,120,${k})`;ctx.beginPath();ctx.arc(200,120-k*60,14,0,7);ctx.fill();}
function villageBack(){for(let i=0;i<16;i++)for(let j=0;j<5;j++)ctx.drawImage(tile(((i*7+j*13)%9===0)?'f':'.',0,0,(i+j)%3),i*T,144+j*T);
  for(let i=0;i<16;i++)ctx.drawImage(tile('p',0,0,i%3),i*T,176);ctx.fillStyle='rgba(10,6,40,0.45)';ctx.fillRect(0,144,W,H-144);
  drawDonutHouse(14,96,0,G.t);drawDonutHouse(190,96,2,G.t);ctx.fillStyle='rgba(10,6,40,0.3)';ctx.fillRect(0,90,W,60);}
function drawTitle(){nightSky();villageBack();
  drawMallow(120,162,0,(G.t>>4)&1?0:2,0,'happy',Math.sin(G.t/18)*1.3);ctx.drawImage(EMBER[(G.t>>3)&1],56,162);ctx.drawImage(EMBER[(G.t>>3)&1^1],180,162);lights=[{x:64,y:170,r:24},{x:188,y:170,r:24}];
  drawLogo(W/2,22,G.t);drawLights();
  const items=menuItems();
  drawBox(36,80,184,18+items.length*11);
  tapZones=items.map((s,i)=>({x:36,y:84+i*11,w:184,h:11,cb:()=>{if(G.menu===i)pressed.a=1;else{G.menu=i;audio.sfx('menu');}}}));
  items.forEach((s,i)=>{const sel=G.menu===i;text((sel?'> ':'')+s.label,W/2,86+i*11,sel?'#fffaf0':'#b9a5c6','center');});
  if(G.t>>5&1)text('A to choose',W/2,86+items.length*11,'#7a5a30','center');}
function drawHelp(){const touch=document.body.classList.contains('touch');ctx.fillStyle='rgba(23,17,28,0.96)';ctx.fillRect(0,0,W,H);text('HOW TO PLAY',W/2,6,'#ffb347','center');
  const rows=touch?[['Move','Joystick'],['Sword, talk','A'],['Spear thrust','B'],['Spear throw','B twice fast'],['Frost sweep','hold B, release'],['Vault gap','B while rolling'],['Roll (dodge)','ROLL'],['Item / Mallo','ITEM'],['Pause, map','START'],['Menus','flick stick, tap']]
    :[['Move','Arrows / WASD'],['Sword, talk','Z or J'],['Spear thrust','X or K'],['Spear throw','X twice fast'],['Frost sweep','hold X, release'],['Vault gap','X while rolling'],['Roll (dodge)','C / L / Shift'],['Item / Mallo','V or I'],['Pause, map','Enter'],['Mute','M']];
  rows.forEach((r,i)=>{text(r[0],14,20+i*11,'#b9a5c6');text(r[1],118,20+i*11,'#fffaf0');});
  ctx.fillStyle='#4a3756';ctx.fillRect(14,132,W-28,1);
  ['Fire TOASTS you. Full = melt.','Jars, water, houses cool you.','Soggy Puff cannot be toasted.','Half toasted: slow but tough.'].forEach((l,i)=>text(l,14,138+i*11,'#e9d6c4'));
  if(G.t>>4&1)text(touch?'TAP OR A TO CLOSE':'A OR ENTER TO CLOSE',W/2,H-16,'#ffb347','center');tapZones=[{x:0,y:0,w:W,h:H,cb:()=>{pressed.a=1;}}];}
function menuItems(){const it=[];if(G.hasSave)it.push({id:'cont',label:'CONTINUE'});it.push({id:'new',label:'NEW GAME'});if(G.savedCleared)it.push({id:'ngp',label:'NEW GAME+'});it.push({id:'help',label:'HOW TO PLAY'});
  it.push({id:'diff',label:'DIFFICULTY: '+(hard()?'HARD':'NORMAL')});it.push({id:'timer',label:'TIMER: '+(G.opts.timer?'ON':'OFF')});it.push({id:'cool',label:'COOLING: '+(G.opts.cooling==='jars'?'JARS ONLY':'NORMAL')});return it;}
function saveOpts(){try{localStorage.setItem('marshmallow-quest-opts',JSON.stringify({diff:G.diff,opts:G.opts}));}catch(e){}}
function loadOpts(){try{const d=JSON.parse(localStorage.getItem('marshmallow-quest-opts'));if(d){G.diff=d.diff||'normal';G.opts=d.opts||G.opts;}const b=localStorage.getItem('marshmallow-quest-best');if(b)G.best=+b;const sv=JSON.parse(localStorage.getItem(SAVE_KEY));G.savedCleared=!!(sv&&sv.cleared);}catch(e){}}
const INTRO=[{len:260,txt:'Donut Village, one warm summer night. Puff and the buddies are out watching the stars.'},
  {len:300,txt:'Fire monsters from EMBER KEEP! They grab every marshmallow they can reach...'},
  {len:260,txt:'...except Puff. Fluff, Mallo, Squish, Dot and Bibi are carried off to the castle in the north.'},
  {len:1e9,txt:''}];
function drawIntro(){const ph=G.introPhase,it=G.introT;nightSky();villageBack();lights=[];
  const bx=[52,84,150,182,214],by=[160,166,164,160,166];
  let lift=0,toast=0,emberY=-30,shake=0;
  if(ph===1){const k=Math.min(1,it/120);emberY=-30+k*(170);toast=Math.max(0,(it-120)/150);}
  if(ph>=2){const k=Math.min(1,it/150);lift=k*k*220;toast=0.7;shake=ph===2?Math.sin(it/2)*(it<60?1:0):0;}
  for(let i=0;i<5;i++){const y=by[i]-lift;if(ph>=1&&ph<3){const ey=ph===1?Math.min(emberY,by[i]-14):by[i]-14-lift;ctx.drawImage(EMBER[(G.t>>3)&1],bx[i]-3,ey-6);lights.push({x:bx[i]+5,y:ey+2,r:22});}
    if(y>-20&&ph<3){drawShadow(bx[i]+5,by[i]+13,10);drawMallow(bx[i]-3,y-3,0,ph===0?((G.t>>4)&1?0:2):0,Math.min(1,toast),toast>0.2?'sad':'happy');}}
  drawMallow(117+shake,163,ph>=2?0:1,ph===0?((G.t>>5)&1?0:2):0,0,ph>=2?'sad':'ok');
  drawLights();
  if(ph<3){const lines=wrap(INTRO[ph].txt);drawBox(8,8,W-16,12+lines.length*11);lines.forEach((l,i)=>text(l,16,14+i*11));if(G.t>>4&1)text('A: next  START: skip',W-16,H-14,'#b9a5c6','right');}
  else{drawBox(24,36,W-48,130);text('YOUR QUEST',W/2,46,'#ffb347','center');ctx.fillStyle='#7a5a30';ctx.fillRect(40,58,W-80,1);
    const lines=['Rescue all 5 buddies from','Ember Keep.','','Fire TOASTS you. Toast all','the way and you melt!','','First: talk to the ELDER','in the PINK donut house.'];lines.forEach((l,i)=>text(l,W/2,64+i*10,i<2?'#fffaf0':'#e9d6c4','center'));
    if(G.t>>4&1)text('PRESS A TO BEGIN',W/2,152,'#fffaf0','center');}}
const CREDITS=['MARSHMALLOW QUEST','','Puff ........... You','Fluff, Mallo, Squish,','Dot and Bibi .. Rescued','King Mallow ... Restored','','Pyre Lord ..... Doused','Magma Toad .... Deflated','','Donut Village thanks you.','Glaze party at Crumb\'s.','','Thanks for playing!'];
function drawEnding(){const t=G.endT;const k=Math.min(1,t/900);dawnSky(k);
  for(let i=0;i<16;i++)for(let j=0;j<5;j++)ctx.drawImage(tile(((i*7+j*13)%9===0)?'f':'.',0,0,(i+j)%3),i*T,144+j*T);for(let i=0;i<16;i++)ctx.drawImage(tile('p',0,0,i%3),i*T,176);
  ctx.fillStyle=`rgba(10,6,40,${0.45*(1-k)})`;ctx.fillRect(0,144,W,H-144);drawDonutHouse(14,96,0,G.t);drawDonutHouse(190,96,2,G.t);ctx.fillStyle=`rgba(10,6,40,${0.3*(1-k)})`;ctx.fillRect(0,90,W,60);
  // the parade walks home from the right, Puff leading, the King last
  const start=W+20,speed=0.45;const px=start-t*speed;
  for(let i=0;i<6;i++){const x=px+i*22;const y=165+Math.sin(G.t/6+i)*1.5;if(x>-20&&x<W+20){drawShadow(x+5,y+13,10);if(i===5)drawCrown(x-1,y-8);drawMallow(x-3,y-3,2,(G.t>>3)&3,0,'happy');}}
  if(t>420){const alpha=Math.min(1,(t-420)/60);ctx.fillStyle=`rgba(23,17,28,${alpha*0.6})`;ctx.fillRect(0,0,W,H);ctx.globalAlpha=alpha;const sy=H-(t-420)*0.35;CREDITS.forEach((l,i)=>{const y=sy+i*14;if(y>-10&&y<H-HUD+10)text(l,W/2,y,i===0?'#ffb347':'#fffaf0','center');});ctx.globalAlpha=1;}
  if(t>1100&&(G.t>>5&1))text('PRESS START',W/2,200,'#fffaf0','center');}

// ---------- main loop ----------
function resetWorld(){for(const k in MAPS)for(const o of MAPS[k].objs){delete o.talked;delete o.hits;delete o.out;delete o.cut;}
  for(const k in MAPS)MAPS[k].objs=MAPS[k].objs.filter(o=>!o.fromBush&&!o.drop&&o.type!=='sprinkle');G.msg=null;G.msgQ=[];G.choice=null;G.goal='';G.banner=null;G.bossPhase=0;G.gauntlet=null;}
function newGame(plus){const keep=plus?{cap:P.cap,coins:G.coins,items:G.items,seals:G.seals}:null;
  G.flags={};G.freed={};G.opened={};G.q={};G.taken={};G.deaths=0;G.win=false;G.visited={};G.coins=0;G.items={frost:0,lamp:false,swordLv:1};G.seals=0;G.follower=null;G.F=null;G.dayT=2600;G.playT=0;G.cleared=false;G.ngplus=!!plus;
  resetWorld();Object.assign(P,mkPlayer(0,0));G.lastHome={map:'home',x:5,y:7};
  if(plus){P.cap=keep.cap;G.coins=keep.coins;G.items=keep.items;G.seals=keep.seals;G.flags.sword=true;G.flags.spear=true;G.diff='hard';for(let k=1;k<=4;k++)if(k<=keep.seals)G.flags['seal'+k]=true;}
  loadMap('overworld',24,52,1);G.scene='play';
  if(plus)say(["NEW GAME+. The fire came back, and this time it reached the village. Puff keeps the sword, the spear and every upgrade. The monsters keep nothing back."],null,'NG+');}
function continueGame(){resetWorld();Object.assign(P,mkPlayer(0,0));if(!loadSave())return newGame();
  loadMap(G.saved.map,G.saved.tx,G.saved.ty,0);G.scene='play';G.goal=goalText();}
function step(){G.t++;pollGamepad();
  if(justPressed('mute')){audio.setMute(!audio.muted);}
  if(G.help){if(justPressed('a')||justPressed('b')||justPressed('start'))G.help=false;pressed.c=0;pressed.item=0;return;}
  if(G.scene==='title'){const items=menuItems();const n=items.length;if(justPressed('up')){G.menu=(G.menu+n-1)%n;audio.sfx('menu');}if(justPressed('down')){G.menu=(G.menu+1)%n;audio.sfx('menu');}G.menu=Math.min(G.menu,n-1);
    if(justPressed('start')||justPressed('a')){audio.unlock();const id=items[G.menu].id;
      if(id==='help'){G.help=true;audio.sfx('menu');}else if(id==='cont')continueGame();else if(id==='new'){G.scene='intro';G.introPhase=0;G.introT=0;audio.play('village');}else if(id==='ngp')newGame(true);
      else if(id==='diff'){G.diff=hard()?'normal':'hard';audio.sfx('menu');saveOpts();}else if(id==='timer'){G.opts.timer=!G.opts.timer;audio.sfx('menu');saveOpts();}else if(id==='cool'){G.opts.cooling=G.opts.cooling==='jars'?'normal':'jars';audio.sfx('menu');saveOpts();}}
    pressed.b=0;pressed.c=0;pressed.item=0;return;}
  if(G.scene==='intro'){G.introT++;if(justPressed('start')){newGame();return;}
    if(justPressed('a')||G.introT>INTRO[G.introPhase].len){if(G.introPhase===3){newGame();return;}G.introPhase++;G.introT=0;}pressed.b=0;return;}
  if(G.scene==='ending'){G.endT++;if(G.endT>1100&&(justPressed('start')||justPressed('a'))){G.scene='title';G.menu=0;checkSave();loadOpts();audio.play('village');}return;}
  if(G.trans){G.trans.t++;if(G.trans.t>=22)G.trans=null;return;}
  if(G.fade){G.fade+=G.fadeTo?0.08:-0.08;if(G.fade>=1&&G.fadeTo){const cb=G.fadeTo;G.fadeTo=null;cb();}if(G.fade<=0)G.fade=0;return;}
  if(justPressed('start')){G.paused=!G.paused;audio.sfx('menu');}if(G.paused){if(justPressed('b')){G.help=true;audio.sfx('menu');}return;}
  const goal=goalText();if(goal!==G.goal){G.goal=goal;G.banner={text:goal,t:240};}
  if(G.choice){const c=G.choice;if(justPressed('up')){c.idx=(c.idx+c.opts.length-1)%c.opts.length;audio.sfx('menu');}if(justPressed('down')){c.idx=(c.idx+1)%c.opts.length;audio.sfx('menu');}
    if(justPressed('a')){G.choice=null;audio.sfx('menu');c.cb(c.idx);}else if(justPressed('b')){G.choice=null;c.cb(-1);}pressed.c=0;pressed.item=0;released.b=0;return;}
  if(G.msg){if(justPressed('a')||justPressed('b')||justPressed('start')){if(G.msgChar<msgTotal())G.msgChar=msgTotal();else{nextMsg();if(!G.msg)P.hurt=Math.max(P.hurt,20);}}pressed.a=0;pressed.b=0;pressed.c=0;pressed.item=0;released.b=0;return;}
  if(G.hitstop>0){G.hitstop--;return;}
  if(P.melting){updateMelt();return;}
  updatePlayer();updateEnemies();updateMechanics();updateCam(false);if(G.shake>0)G.shake--;}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);lights=[];tapZones=[];
  if(G.scene==='title'){drawTitle();if(G.help)drawHelp();return;}if(G.scene==='intro'){drawIntro();return;}if(G.scene==='ending'){drawEnding();return;}
  drawScene();
  if(G.trans){const k=G.trans.t/22,e=1-Math.pow(1-k,3);const d=G.trans.dir;const dx=d===2?1:d===3?-1:0,dy=d===1?1:d===0?-1:0;const sw=W,sh=H-HUD;
    bctx.clearRect(0,0,W,H);bctx.drawImage(cv,0,0);ctx.clearRect(0,0,W,H-HUD);
    ctx.drawImage(snap,0,0,W,sh,Math.round(dx*e*sw),Math.round(dy*e*sh),W,sh);ctx.drawImage(buf,0,0,W,sh,Math.round(dx*(e-1)*sw),Math.round(dy*(e-1)*sh),W,sh);}
  drawHUD();drawMsg();drawChoice();if(!G.msg&&!G.choice)drawBanner();
  if(G.paused)drawPause();if(G.help)drawHelp();
  if(G.fade){ctx.fillStyle='rgba(23,17,28,'+Math.min(1,G.fade)+')';ctx.fillRect(0,0,W,H);}}
let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(100,ts-last);last=ts;acc+=dt;while(acc>=1000/60){step();acc-=1000/60;}render();}
function fit(){const wrapEl=document.getElementById('wrap');const touch=document.body.classList.contains('touch');const land=innerWidth>innerHeight;
  let s=touch?(land?Math.min((innerWidth-40)/W,(innerHeight-20)/H):Math.min(wrapEl.clientWidth/W,innerHeight*0.56/H)):Math.min(wrapEl.clientWidth/W,wrapEl.clientHeight/H);
  s=s>=2?Math.floor(s):Math.max(0.9,s);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('orientationchange',()=>setTimeout(fit,100));
addEventListener('resize',fit);fit();checkSave();loadOpts();
if(document.fonts)document.fonts.load('8px "Press Start 2P"').then(()=>{logoCache=null;}).catch(()=>{});
requestAnimationFrame(loop);
</script>
