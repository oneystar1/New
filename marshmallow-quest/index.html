<title>Marshmallow Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen arcade cabinet. A 256x224 SNES-size canvas scaled with crisp pixels,
   centered on a dark cabinet background, touch controls under it on phones. Single dark look. */
:root{
  --bg:#17111c; --panel:#241a2c; --line:#4a3756; --fg:#f6ecdc; --muted:#b9a5c6;
  --accent:#ffb347; --fire:#ff5a2b; --mallow:#fff6e8;
  --font-pixel:"Press Start 2P", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-pixel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
#wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;max-width:100%;max-height:100%;
  border:4px solid var(--line);box-shadow:0 0 0 2px #000,0 12px 40px #000c;touch-action:none}
#top{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:center;line-height:1.6}
#top b{color:var(--accent);font-weight:normal}
#pad{display:none;width:100%;max-width:440px;justify-content:space-between;align-items:flex-end;gap:12px;position:relative;
  margin:auto 0;padding:54px 0 env(safe-area-inset-bottom,0px);box-sizing:border-box;flex:0 0 auto}
body.touch #pad{display:flex}
:root{--btnscale:1}
.stick,.btns{transform:scale(var(--btnscale))}.stick{transform-origin:bottom left}.btns{transform-origin:bottom right}
body.lefty .stick{transform-origin:bottom right}body.lefty .btns{transform-origin:bottom left}
.mid{position:relative;z-index:2}
body.lefty #pad{flex-direction:row-reverse}
body.lefty .btns .b{left:124px}body.lefty .btns .a{left:0}
body.touch #top{display:none}
body.touch #wrap{align-items:flex-start;flex:0 0 auto}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px;position:absolute;left:50%;top:0;transform:translateX(-50%)}
.mid button{background:var(--panel);border:3px solid var(--line);color:var(--fg);font-family:var(--font-pixel);width:72px;height:30px;border-radius:15px;font-size:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.mid button.on{background:var(--line)}
.stick{position:relative;width:136px;height:136px;border-radius:50%;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 18px #1c1422;touch-action:none;user-select:none;-webkit-user-select:none}
.stick .knob{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:var(--line);border:3px solid var(--muted);box-sizing:border-box;box-shadow:0 3px 0 #000a;pointer-events:none;transition:transform .05s}
.stick.on .knob{background:var(--accent);border-color:#fff}
.stick::before{content:"";position:absolute;left:62px;top:14px;width:12px;height:12px;border-left:3px solid var(--line);border-top:3px solid var(--line);transform:rotate(45deg);opacity:.6}
.btns{position:relative;width:176px;height:166px}
.btns button{position:absolute;background:var(--panel);border:3px solid var(--line);color:var(--fg);
  font-family:var(--font-pixel);font-size:11px;border-radius:50%;width:52px;height:52px;touch-action:none;user-select:none;-webkit-user-select:none}
.btns button:active,.btns button.on{background:var(--line)}
/* diamond: ITEM top, B left, A right, ROLL bottom, 14px+ between any two */
.btns .i{left:66px;top:0;width:44px;height:44px;border-color:#c9a0ff;font-size:8px}.btns .b{left:0;top:60px;border-color:#5a7fc6}.btns .a{left:124px;top:54px;border-color:var(--fire)}.btns .c{left:66px;top:118px;width:44px;height:44px;border-color:#7cc47a;font-size:8px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (orientation:landscape){
  body.touch{padding-block:4px}
  body.touch #wrap{flex:1 1 auto;align-items:center}
  body.touch #pad{position:fixed;inset:0;margin:0;max-width:none;padding:0 max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));box-sizing:border-box;align-items:flex-end;pointer-events:none;opacity:.85}
  body.touch .mid{left:auto;transform:none}
  body.touch #pad>*{pointer-events:auto}
  body.touch .mid{position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px))}
  body.touch .stick{width:120px;height:120px}
  body.touch .stick .knob{left:35px;top:35px}
  body.touch .stick::before{left:54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div id="top">Arrows/WASD move &nbsp;·&nbsp; <b>Z</b>/<b>J</b> sword &nbsp;·&nbsp; <b>X</b>/<b>K</b> spear &nbsp;·&nbsp; <b>C</b>/<b>L</b>/<b>Shift</b> roll &nbsp;·&nbsp; <b>V</b>/<b>I</b> item &nbsp;·&nbsp; <b>Enter</b> start/pause &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; gamepad ok</div>
<div id="wrap"><canvas id="c" width="256" height="224" aria-label="Marshmallow Quest game screen"></canvas></div>
<div id="pad">
  <div class="stick" id="stick" aria-label="Joystick"><div class="knob" id="knob"></div></div>
  <div class="mid"><button class="s" data-k="start" aria-label="Start">START</button></div>
  <div class="btns"><button class="b" data-k="b" aria-label="Spear">B</button><button class="c" data-k="c" aria-label="Roll">ROLL</button><button class="i" data-k="item" aria-label="Item">ITEM</button><button class="a" data-k="a" aria-label="Sword">A</button></div>
</div>
<script>
// ===================== MARSHMALLOW QUEST =====================
// A 16-bit top-down adventure. You are Puff, a marshmallow. Your buddies were
// carried off to Ember Keep by the fire monsters. Get too close to fire and you
// toast; toast all the way and you melt. Find the Fire Spear to put flames out.
'use strict';
const W=256,H=224,T=16,HUD=24;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const bctx=buf.getContext('2d');
const snap=document.createElement('canvas');snap.width=W;snap.height=H;const sctx=snap.getContext('2d');

// ---------- input ----------
const keys={up:0,down:0,left:0,right:0,a:0,b:0,c:0,item:0,start:0,mute:0};const released={};
const pressed={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',KeyJ:'a',Space:'a',KeyX:'b',KeyK:'b',KeyC:'c',KeyL:'c',ShiftLeft:'c',ShiftRight:'c',KeyV:'item',KeyI:'item',Enter:'start',Escape:'start',KeyM:'mute'};
const pressedT={};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(!keys[k]){pressed[k]=1;pressedT[k]=performance.now();}keys[k]=1;audio.unlock();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();keys[k]=0;released[k]=1;});
function justReleased(k){const v=released[k];released[k]=0;return !!v;}
// a press is remembered for about 8 frames so an attack queued at the end of a roll still fires, but stale presses do not
function justPressed(k){const v=pressed[k];if(v&&pressedT[k]!=null&&performance.now()-pressedT[k]>140){pressed[k]=0;return false;}pressed[k]=0;return !!v;}
function clearActions(){pressed.a=0;pressed.b=0;pressed.c=0;pressed.item=0;}
const pad=document.getElementById('pad');
function bindBtn(btn){const k=btn.dataset.k;
  const on=e=>{e.preventDefault();btn.classList.add('on');if(!keys[k]){pressed[k]=1;pressedT[k]=performance.now();}keys[k]=1;audio.unlock();};
  const off=e=>{e.preventDefault();btn.classList.remove('on');if(keys[k])released[k]=1;keys[k]=0;};
  btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
  btn.addEventListener('contextmenu',e=>e.preventDefault());}
pad.querySelectorAll('button').forEach(bindBtn);
const joy={x:0,y:0,on:false};
{const st=document.getElementById('stick'),kn=document.getElementById('knob');let pid=null;
  const upd=e=>{const r=st.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width/2-12;const d=Math.hypot(dx,dy);
    if(d>max){dx=dx/d*max;dy=dy/d*max;}kn.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.min(1,d/max);
    if(m<0.18){joy.x=joy.y=0;}else{const a=Math.atan2(dy,dx);const k=(m-0.18)/0.82;joy.x=Math.cos(a)*k;joy.y=Math.sin(a)*k;}
    let dir=null;if(m>0.5)dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');else if(m<0.3)dir=null;else dir=joy.lastDir;
    if(dir&&dir!==joy.lastDir){pressed[dir]=1;pressedT[dir]=performance.now();}joy.lastDir=dir;
    // swipe to roll: a fast flick from the centre
    if(G.opts.touch&&G.opts.touch.swipe&&!joy.swiped&&m>0.9&&performance.now()-joy.downT<130){joy.swiped=true;pressed.c=1;pressedT.c=performance.now();}};
  st.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{st.setPointerCapture(pid);}catch(err){}st.classList.add('on');joy.on=true;joy.downT=performance.now();joy.swiped=false;audio.unlock();upd(e);});
  st.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e);});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;joy.on=false;joy.x=joy.y=0;joy.lastDir=null;st.classList.remove('on');kn.style.transform='';};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);st.addEventListener('contextmenu',e=>e.preventDefault());}
addEventListener('touchstart',()=>{document.body.classList.add('touch');if(typeof fit==='function')fit();},{once:true,passive:true});
let tapZones=[];
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio.unlock();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  for(const z of tapZones){if(x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h){z.cb();return;}}
  if(typeof G!=='undefined'&&(G.msg||G.scene==='intro'||G.scene==='ending'))pressed.a=1;});
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
// gamepad: standard mapping. Left stick or d-pad moves, A sword, B/Y spear, X roll, Start pauses.
const gp={prev:{}};
function pollGamepad(){if(!navigator.getGamepads)return;const pads=navigator.getGamepads();let g=null;for(const p of pads)if(p&&p.connected){g=p;break;}if(!g)return;
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);const ax=g.axes[0]||0,ay=g.axes[1]||0;
  if(Math.hypot(ax,ay)>0.25){joy.on=true;joy.x=ax;joy.y=ay;gp.joy=true;}else if(gp.joy){joy.on=false;joy.x=joy.y=0;gp.joy=false;}
  const map={a:b(0),b:b(1),item:b(3),c:b(2)||b(4)||b(5),start:b(9),up:b(12),down:b(13),left:b(14),right:b(15)};
  for(const k in map){if(map[k]&&!gp.prev[k]){pressed[k]=1;pressedT[k]=performance.now();keys[k]=1;audio.unlock();}else if(!map[k]&&gp.prev[k]){keys[k]=0;released[k]=1;}gp.prev[k]=map[k];}}

// ---------- audio: chiptune synth, sound effects, music sequencer ----------
const NOTE={};{const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];for(let o=1;o<=7;o++)names.forEach((n,i)=>{NOTE[n+o]=440*Math.pow(2,(o-4)+(i-9)/12);});}
const audio={ctx:null,muted:false,music:{track:null,next:0,step:0,timer:null},sizz:null,
  unlock(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=1;this.master.connect(this.ctx.destination);}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();if(this.ctx&&!this.music.timer)this.music.timer=setInterval(()=>this.tick(),90);},
  setMute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:1;},
  // sounds with a world position are panned by screen position and quieter with distance
  spatial(src){if(!src||typeof G==='undefined'||!G.cam)return null;const sx=src.x+(src.w||10)/2-G.cam.x,sy=src.y+(src.h||10)/2-G.cam.y;const dx=sx-W/2,dy=sy-(H-HUD)/2;const dist=Math.hypot(dx,dy);
    return{pan:Math.max(-0.8,Math.min(0.8,dx/(W/2)*0.8)),gain:Math.max(0.2,Math.min(1,1-dist/340))};},
  out(node,sp){if(sp&&this.ctx.createStereoPanner){const p=this.ctx.createStereoPanner();p.pan.value=sp.pan;node.connect(p);p.connect(this.master);}else node.connect(this.master);},
  tone(f,d,type='square',vol=0.08,slide=0,when=0,src=null){if(!this.ctx)return;const sp=this.spatial(src);if(sp)vol*=sp.gain;const t=this.ctx.currentTime+when;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);this.out(g,sp);o.start(t);o.stop(t+d);},
  noise(d,vol=0.05,hp=800,src=null){if(!this.ctx)return;const sp=this.spatial(src);if(sp)vol*=sp.gain;const n=this.ctx.sampleRate*d|0;const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const data=b.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource();s.buffer=b;const f=this.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=this.ctx.createGain();g.gain.value=vol;s.connect(f);f.connect(g);this.out(g,sp);s.start();},
  step(surface){if(surface==='stone')this.noise(0.04,0.05,2500);else if(surface==='wood')this.tone(180,0.05,'triangle',0.05,-60);else if(surface==='path')this.noise(0.05,0.035,1200);else this.noise(0.06,0.025,600);},
  drone(level){if(!this.ctx)return;if(!this.dro){const o=this.ctx.createOscillator();o.type='triangle';o.frequency.value=55;const o2=this.ctx.createOscillator();o2.type='sawtooth';o2.frequency.value=55.7;const g=this.ctx.createGain();g.gain.value=0;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=220;o.connect(f);o2.connect(f);f.connect(g);g.connect(this.master);o.start();o2.start();this.dro=g;}
    this.dro.gain.setTargetAtTime(Math.min(0.09,level*0.09),this.ctx.currentTime,0.3);},
  sizzle(level){if(!this.ctx)return;if(!this.sizz){const n=this.ctx.sampleRate*2|0;const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      const s=this.ctx.createBufferSource();s.buffer=b;s.loop=true;const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=3000;f.Q.value=0.8;const g=this.ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(this.master);s.start();this.sizz=g;}
    this.sizz.gain.setTargetAtTime(Math.min(0.12,level*0.12),this.ctx.currentTime,0.08);},
  sfx(n,src){switch(n){
    case 'grow':[659,880,1109,1319,1760].forEach((f,i)=>this.tone(f,0.22,'triangle',0.07,0,i*0.07));this.noise(0.15,0.03,5000);break;
    case 'kill':this.tone(260,0.16,'square',0.09,-180,0,src);this.noise(0.12,0.08,1200,src);this.tone(90,0.2,'triangle',0.08,-40,0.03,src);break;
    case 'sword':this.tone(900,0.08,'square',0.05,-500,0,src);this.noise(0.05,0.03,3000,src);break;
    case 'spear':this.tone(300,0.18,'sawtooth',0.05,900);break;
    case 'hit':this.tone(200,0.1,'square',0.07,-120,0,src);this.noise(0.04,0.05,1500,src);break;
    case 'hurt':this.tone(140,0.25,'sawtooth',0.08,-90);break;
    case 'douse':this.tone(1200,0.3,'triangle',0.07,-900,0,src);this.noise(0.25,0.05,4000,src);break;
    case 'item':[523,659,784,1046].forEach((f,i)=>this.tone(f,0.15,'square',0.06,0,i*0.09));break;
    case 'free':[784,988,1175,1568,1175,1568].forEach((f,i)=>this.tone(f,0.14,'triangle',0.07,0,i*0.08));break;
    case 'glaze':this.tone(660,0.12,'sine',0.06,400);break;
    case 'door':this.tone(220,0.15,'triangle',0.06,-100);break;
    case 'text':this.tone(1500,0.02,'square',0.02);break;
    case 'melt':[400,330,260,180,120].forEach((f,i)=>this.tone(f,0.3,'sawtooth',0.06,-40,i*0.16));break;
    case 'boss':this.tone(90,0.4,'sawtooth',0.1,-40,0,src);break;
    case 'roll':this.noise(0.12,0.04,900);this.tone(300,0.1,'triangle',0.03,200);break;
    case 'cut':this.noise(0.08,0.05,1800);this.tone(500,0.06,'square',0.03,-200);break;
    case 'push':this.noise(0.2,0.05,300);break;
    case 'switch':this.tone(400,0.1,'square',0.05);this.tone(600,0.15,'square',0.05,0,0.1);break;
    case 'menu':this.tone(800,0.05,'square',0.04);break;
    case 'coin':this.tone(1300,0.06,'square',0.04);this.tone(1800,0.1,'square',0.04,0,0.06);break;
    case 'freeze':this.tone(1600,0.4,'sine',0.06,-1200);this.noise(0.3,0.04,5000);break;
    case 'steam':this.noise(0.5,0.06,2000,src);break;
    case 'charge':this.tone(200,0.08,'square',0.03,100);break;
    case 'throw':this.noise(0.1,0.04,1500);this.tone(500,0.15,'triangle',0.04,300);break;
    case 'seal':[659,784,988,1319,1568].forEach((f,i)=>this.tone(f,0.25,'triangle',0.06,0,i*0.1));break;
    case 'splash':this.noise(0.2,0.06,600);this.tone(300,0.2,'sine',0.05,-150);break;
    case 'squeeze':this.tone(250,0.3,'sine',0.05,200);break;
    case 'hop':this.tone(400,0.12,'square',0.04,300);break;
    case 'win':[523,659,784,1046,784,1046,1318].forEach((f,i)=>this.tone(f,0.2,'square',0.06,0,i*0.12));break;
  }},
  // music: each track is a list of patterns played in order; a pattern is [lead,bass] strings of 8th notes ('-' holds, '.' rest)
  tick(){this.ambient();if(!this.ctx||this.muted||!this.music.track)return;const m=this.music,tr=TRACKS[m.track];const beat=60/tr.bpm/2;
    while(m.next<this.ctx.currentTime+0.35){const pat=tr.pat[(m.step/16|0)%tr.pat.length];const i=m.step%16;
      const ln=pat[0][i],bn=pat[1][i];if(ln&&ln!=='.'&&ln!=='-'){this.tone(NOTE[ln],beat*0.9,tr.lead||'square',0.035,0,m.next-this.ctx.currentTime);}
      if(bn&&bn!=='.'&&bn!=='-'){this.tone(NOTE[bn],beat*0.8,'triangle',0.05,0,m.next-this.ctx.currentTime);}
      if(tr.drums&&i%4===0)this.noise(0.03,i%8===0?0.04:0.02,i%8===0?400:3000);
      if(typeof G!=='undefined'&&G.alert&&G.scene==='play'){if(i%2===1)this.noise(0.025,0.035,2600);if(i%4===2)this.tone(70,0.08,'square',0.05,-30,m.next-this.ctx.currentTime);}
      m.next+=beat;m.step++;}},
  // ambient beds: short sounds scheduled by area and time of day
  ambient(){if(!this.ctx||this.muted||typeof G==='undefined'||G.scene!=='play')return;const now=this.ctx.currentTime;if(now<(this.ambNext||0))return;const m=G.mapName;let gap=0.6;
    if(m==='overworld'&&nightAmount()>0.5){if(Math.random()<0.5){for(let i=0;i<3;i++)this.tone(4200+Math.random()*300,0.03,'sine',0.012,0,i*0.07);}gap=0.5+Math.random()*0.8;}
    else if(m==='cave'){if(Math.random()<0.35)this.tone(1800+Math.random()*900,0.25,'sine',0.02,-600);gap=0.8+Math.random()*1.6;}
    else if(m==='grotto'){if(Math.random()<0.6)this.tone(240+Math.random()*120,0.08,'sine',0.02,160);gap=0.4+Math.random()*0.8;}
    else if(m==='peaks'||m==='glacier'){this.noise(1.2,0.012+Math.random()*0.01,300);gap=1.0+Math.random()*0.6;}
    else if(m==='coast'){this.noise(1.8,0.014,200);gap=1.6+Math.random()*0.8;}
    else if(m==='castle'||m==='wreck'){if(Math.random()<0.4)this.tone(55+Math.random()*10,0.6,'triangle',0.015,-10);gap=1.5+Math.random()*1.5;}
    else gap=2;this.ambNext=now+gap;},
  play(name){if(this.music.track===name)return;this.music.track=name;this.music.step=0;if(this.ctx)this.music.next=this.ctx.currentTime+0.05;}
};

// Marshmallow body drawn procedurally so it can toast from white to brown to char.
function toastColor(t){const stops=[[255,250,240],[255,226,186],[222,166,84],[132,74,26],[38,20,16]];
  const s=Math.min(3.999,Math.max(0,t)*4),i=Math.floor(s),f=s-i;const a=stops[i],b=stops[i+1];
  return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;}
function shade(c,k){const m=c.match(/\d+/g).map(Number);return `rgb(${Math.min(255,m[0]*k)|0},${Math.min(255,m[1]*k)|0},${Math.min(255,m[2]*k)|0})`;}
// dir: 0 down,1 up,2 left,3 right. frame: walk phase 0..3. mood: 'ok','sad','happy','hurt'. squish: -2..2 vertical breathing offset
function drawMallow(x,y,dir,frame,toast,mood='ok',squish=0,tint){
  let col=toastColor(toast);if(tint==='soggy'){const m=col.match(/\d+/g).map(Number);col=`rgb(${m[0]*0.7|0},${m[1]*0.82|0},${Math.min(255,m[2]*1.05+30)|0})`;}
  else if(tint==='frozen'){const m=col.match(/\d+/g).map(Number);col=`rgb(${Math.min(255,m[0]*0.85+20)|0},${Math.min(255,m[1]*0.95+20)|0},255)`;}
  const dark=shade(col,0.78),hi=shade(col,1.08),out=tint==='soggy'?'#2a3050':tint==='frozen'?'#2a4a7a':'#3a2420';
  x=Math.round(x);y=Math.round(y)+(frame===1||frame===3?1:0);const sq=Math.round(squish);
  const r=(c,i,j,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x+i,y+j,w,h);};
  const fl=frame===1?1:frame===3?-1:0;r(out,4+fl,13,3,2);r(out,9-fl,13,3,2);r('#6b3a22',5+fl,13,1,1);r('#6b3a22',10-fl,13,1,1);
  // body (squish lowers the top edge and widens slightly)
  const top=sq;const ex=sq>0?1:0;
  r(out,4-ex,top,8+ex*2,1);r(out,3-ex,top+1,10+ex*2,1);r(out,2-ex,top+2,12+ex*2,11-top);r(out,3,12,10,1);
  r(col,4-ex,top+1,8+ex*2,1);r(col,3-ex,top+2,10+ex*2,10-top);r(col,4,12,8,1);
  r(dark,11+ex,top+3,2,9-top);r(dark,4,11,8,1);r(dark,10,top+2,2,1);
  r(hi,4-ex,top+2,4,1);r(hi,3-ex,top+3,1,4);r('#ffffff88',5-ex,top+3,2,1);
  if(toast>0.55){r(shade(col,0.6),6,9,2,1);r(shade(col,0.6),9,5,1,2);r(shade(col,0.6),4,7,1,1);}
  const ey=5+Math.max(0,sq);
  if(dir===0){
    if(mood==='hurt'){r(out,5,ey,1,1);r(out,6,ey+1,1,1);r(out,5,ey+2,1,1);r(out,10,ey,1,1);r(out,9,ey+1,1,1);r(out,10,ey+2,1,1);r(out,6,ey+5,4,1);r(out,5,ey+4,1,1);r(out,10,ey+4,1,1);}
    else{r(out,5,ey,2,3);r(out,9,ey,2,3);r('#fff',5,ey,1,1);r('#fff',9,ey,1,1);
      if(mood==='happy'){r(out,6,ey+4,4,1);r(out,5,ey+3,1,1);r(out,10,ey+3,1,1);}
      else if(mood==='sad'){r(out,6,ey+5,4,1);r(out,5,ey+6,1,1);r(out,10,ey+6,1,1);}
      else r(out,7,ey+4,2,1);}
    r('#ff9bb0aa',4,ey+3,1,1);r('#ff9bb0aa',11,ey+3,1,1);}
  else if(dir===2){if(mood==='hurt'){r(out,4,ey,1,1);r(out,5,ey+1,1,1);r(out,4,ey+2,1,1);}else{r(out,4,ey,2,3);r('#fff',4,ey,1,1);}r(out,4,ey+4,2,1);r('#ff9bb0aa',7,ey+3,1,1);}
  else if(dir===3){if(mood==='hurt'){r(out,11,ey,1,1);r(out,10,ey+1,1,1);r(out,11,ey+2,1,1);}else{r(out,10,ey,2,3);r('#fff',11,ey,1,1);}r(out,10,ey+4,2,1);r('#ff9bb0aa',8,ey+3,1,1);}
  else{r(dark,6,top+4,4,1);}
}

// Donut house: 48x56 ring house with glaze, drips, sprinkles, arched door and a smoking chimney.
function drawDonutHouse(x,y,style,t){
  const glaze=['#ff7fb0','#8ad7ff','#ffd36b','#c9a0ff'][style],glazeD=['#d9548a','#4fa8e6','#d9a63a','#9a6fd9'][style],ring='#dca45c',ringD='#a8713a',out='#3a2214';
  const sprin=['#fffaf0','#ff3b1f','#3fa34d','#3e6fd8','#ffd23f','#ff5aa5'];x=Math.round(x);y=Math.round(y);
  const ell=(c,cx,cy,rx,ry)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x+cx,y+cy,rx,ry,0,0,7);ctx.fill();};
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(x+3,y+50,42,4);
  ell(out,24,32,25,23);ell(ringD,24,31,24,22);ell(ring,24,27,23,20);
  ell(out,24,21,22,15);ell(glazeD,24,22,21,14);ell(glaze,24,20,21,13);
  for(let i=0;i<10;i++){const h=3+((i*7)%4);ctx.fillStyle=glazeD;ctx.fillRect(x+3+i*4.6|0,y+30,3,h+1);ctx.fillStyle=glaze;ctx.fillRect(x+3+i*4.6|0,y+29,3,h);}
  ctx.fillStyle='#ffffff55';ctx.fillRect(x+8,y+11,8,2);ctx.fillRect(x+6,y+13,3,2);
  const rnd=seeded(style*7+1);for(let i=0;i<16;i++){ctx.fillStyle=sprin[i%6];const a=rnd()*6.28,rr=rnd()*9+3;const sx=x+24+Math.cos(a)*rr*1.9|0,sy=y+19+Math.sin(a)*rr|0;if(i%2)ctx.fillRect(sx,sy,3,1);else ctx.fillRect(sx,sy,1,3);}
  // door
  ctx.fillStyle=out;ctx.fillRect(x+18,y+27,12,25);ctx.fillRect(x+19,y+26,10,1);ctx.fillStyle='#2a1a14';ctx.fillRect(x+19,y+28,10,24);
  ctx.fillStyle='#6b3a22';ctx.fillRect(x+20,y+29,8,22);ctx.fillStyle='#8a5a2a';ctx.fillRect(x+21,y+30,2,20);ctx.fillRect(x+25,y+30,2,20);ctx.fillStyle='#ffd23f';ctx.fillRect(x+26,y+41,1,1);
  // windows
  for(const wx of [8,34]){ctx.fillStyle=out;ctx.fillRect(x+wx-1,y+25,7,7);ctx.fillStyle='#fff3a0';ctx.fillRect(x+wx,y+26,5,5);ctx.fillStyle='#8a5a2a';ctx.fillRect(x+wx+2,y+26,1,5);ctx.fillRect(x+wx,y+28,5,1);}
  // chimney and smoke
  ctx.fillStyle=out;ctx.fillRect(x+32,y+5,6,10);ctx.fillStyle='#8a5a2a';ctx.fillRect(x+33,y+6,4,9);ctx.fillStyle='#6b3a22';ctx.fillRect(x+33,y+6,4,1);
  for(let i=0;i<3;i++){const k=((t||0)/40+i*0.33)%1;ctx.fillStyle='rgba(255,255,255,'+(0.5-k*0.5)+')';ctx.fillRect(x+33+Math.sin(k*6+i)*3|0,y+3-k*12|0,4,3);}

  for(const o of m.objs){if(o.type==='block'){o.x=o.ox!=null?o.ox:(o.ox=o.x);o.y=o.oy!=null?o.oy:(o.oy=o.y);o.ax=o.ay=0;}}
  const cooled=name==='castle'&&G.flags.bossDead&&!G.gauntlet;
  const list=(cooled?[]:m.enemies).concat(!cooled&&hard()&&m.hard?m.hard:[]).concat(G.ngplus&&m.ngplus?m.ngplus:[]);

  if(cooled){for(const o of m.objs){if(o.type==='torch')o.out=true;}for(let j=0;j<m.h;j++)for(let i=0;i<m.w;i++)if(m.t[j][i]==='L')G.frozen[i+','+j]=1e9;m.cooledNow=true;}else if(name==='castle'){for(const o of m.objs){if(o.type==='torch')delete o.out;}m.cooledNow=false;}

function npcVisible(o){return (!o.cond||G.freed[o.cond])&&(!o.req||G.flags[o.req]);}
function refreshSolids(){const m=G.map;const s={};const add=(x,y,w=1)=>{for(let i=0;i<w;i++)s[(x+i)+','+y]=1;};
  for(const o of m.objs){switch(o.type){
    case 'buddy':if(!G.freed[o.id])add(o.x,o.y,o.w||1);break;
    case 'chest':case 'sign':case 'torch':case 'block':case 'shelf':case 'pedestal':case 'trophy':case 'campfire':add(o.x,o.y);break;
    case 'bed':add(o.x,o.y);add(o.x,o.y+1);break;
    case 'curtain':if(P.toast/P.cap<0.5)add(o.x,o.y,o.w);break;
    case 'npc':if(npcVisible(o))add(o.x,o.y);break;
    case 'bush':if(!o.cut)add(o.x,o.y);break;
    case 'firegate':if(!G.flags[o.id])add(o.x,o.y,o.w);break;

// any lit fire in view keeps Puff from cooling down
function fireOnScreen(){const cx=G.cam.x-16,cy=G.cam.y-16,cw=W+32,ch=H+32;const inView=(x,y)=>x>=cx&&x<cx+cw&&y>=cy&&y<cy+ch;

  ctx.fillStyle=`rgba(10,6,40,${0.45*(1-k)})`;ctx.fillRect(0,144,W,H-144);drawDonutHouse(14,96,0,G.t);drawDonutHouse(190,96,2,G.t);ctx.fillStyle=`rgba(10,6,40,${0.3*(1-k)})`;ctx.fillRect(0,90,W,60);
  // the parade walks home from the right, Puff leading, the King last
  const start=W+20,speed=0.45;const px=start-t*speed;
  for(let i=0;i<6;i++){const x=px+i*22;const y=165+Math.sin(G.t/6+i)*1.5;if(x>-20&&x<W+20){drawShadow(x+5,y+13,10);if(i===5)drawCrown(x-1,y-8);drawMallow(x-3,y-3,2,(G.t>>3)&3,0,'happy');}}
  if(t>420){const alpha=Math.min(1,(t-420)/60);ctx.fillStyle=`rgba(23,17,28,${alpha*0.6})`;ctx.fillRect(0,0,W,H);ctx.globalAlpha=alpha;const sy=H-(t-420)*0.35;CREDITS.forEach((l,i)=>{const y=sy+i*14;if(y>-10&&y<H-HUD+10)text(l,W/2,y,i===0?'#ffb347':'#fffaf0','center');});ctx.globalAlpha=1;}
  if(t>180&&(G.t>>5&1))text('PRESS START',W/2,200,'#fffaf0','center');}

// ---------- main loop ----------
function resetWorld(){for(const k in MAPS)for(const o of MAPS[k].objs){delete o.talked;delete o.hits;delete o.out;delete o.cut;}
  for(const k in MAPS)MAPS[k].objs=MAPS[k].objs.filter(o=>!o.fromBush&&!o.drop&&o.type!=='sprinkle');G.msg=null;G.msgQ=[];G.choice=null;G.goal='';G.banner=null;G.bossPhase=0;G.gauntlet=null;}
function newGame(plus){const keep=plus?{cap:P.cap,coins:G.coins,items:G.items,seals:G.seals,toppings:G.toppings,badges:G.badges||{},best:G.best}:null;
  G.flags={};G.freed={};G.opened={};G.q={};G.taken={};G.deaths=0;G.win=false;G.visited={};G.stats={melts:{},causes:{},time:{}};G.badges={};G.coins=0;G.items={frost:0,lamp:false,swordLv:1};G.seals=0;G.toppings=null;G.follower=null;G.F=null;G.dayT=2600;G.playT=0;G.cleared=false;G.ngplus=!!plus;
  resetWorld();Object.assign(P,mkPlayer(0,0));G.lastHome={map:'home',x:5,y:7};
  if(plus){P.cap=keep.cap;G.coins=keep.coins;G.items=keep.items;G.seals=keep.seals;G.toppings=keep.toppings;G.badges=keep.badges;G.flags.sword=true;G.flags.spear=true;G.diff='hard';for(let k=1;k<=4;k++)if(k<=keep.seals)G.flags['seal'+k]=true;}
  loadMap('overworld',24,52,1);G.scene='play';
  if(plus)say(["NEW GAME+. The fire came back, and this time it reached the village. Puff keeps the sword, the spear and every upgrade. The monsters keep nothing back."],null,'NG+');}
function continueGame(){resetWorld();Object.assign(P,mkPlayer(0,0));if(!loadSave())return newGame();
  loadMap(G.saved.map,G.saved.tx,G.saved.ty,0);G.scene='play';G.goal=goalText();}
function step(){G.t++;pollGamepad();
  if(justPressed('mute')){audio.setMute(!audio.muted);}
  if(G.help){if(justPressed('a')||justPressed('b')||justPressed('start'))G.help=false;pressed.c=0;pressed.item=0;return;}
  if(G.showStats){if(justPressed('a')||justPressed('item')||justPressed('start')||justPressed('b'))G.showStats=false;pressed.c=0;return;}
  if(G.showBadges){if(justPressed('left')){G.badgePage=Math.max(0,(G.badgePage||0)-1);audio.sfx('menu');}if(justPressed('right')){G.badgePage=Math.min(Math.ceil(BADGES.length/6)-1,(G.badgePage||0)+1);audio.sfx('menu');}if(justPressed('a')||justPressed('item')||justPressed('start')||justPressed('b')){G.showBadges=false;clearActions();}pressed.c=0;return;}
  if(G.choice){const c=G.choice;if(justPressed('up')){c.idx=(c.idx+c.opts.length-1)%c.opts.length;audio.sfx('menu');}if(justPressed('down')){c.idx=(c.idx+1)%c.opts.length;audio.sfx('menu');}
    if(justPressed('a')||justPressed('start')){G.choice=null;audio.sfx('menu');c.cb(c.idx);}else if(justPressed('b')){G.choice=null;c.cb(-1);}pressed.c=0;pressed.item=0;released.b=0;return;}
  if(G.scene==='title'){const items=menuItems();const n=items.length;if(justPressed('up')){G.menu=(G.menu+n-1)%n;audio.sfx('menu');}if(justPressed('down')){G.menu=(G.menu+1)%n;audio.sfx('menu');}G.menu=Math.min(G.menu,n-1);
    if(justPressed('start')||justPressed('a')){audio.unlock();const id=items[G.menu].id;
      const startNew=()=>{if(G.opts.introSeen)ask('Play the opening again?',['Watch it','Skip it'],i=>{if(i===1){newGame();}else{G.scene='intro';G.introPhase=0;G.introT=0;audio.play('village');}});else{G.scene='intro';G.introPhase=0;G.introT=0;audio.play('village');}};
      if(id==='help'){G.help=true;audio.sfx('menu');}else if(id==='cont')continueGame();
      else if(id==='new'){if(G.hasSave)ask('Start a new game? Your saved game will be replaced at the first auto-save.',['Keep my save','Start new'],i=>{if(i===1)startNew();});else startNew();}
      else if(id==='erase'){ask('Erase the saved game? This cannot be undone.',['Keep it','Erase'],i=>{if(i===1){try{localStorage.removeItem(SAVE_KEY);}catch(e){}G.hasSave=false;G.savedCleared=false;G.menu=0;audio.sfx('douse');}});}
      else if(id==='ngp')newGame(true);
      else if(id==='diff'){G.diff=G.diff==='normal'?'hard':G.diff==='hard'?'easy':'normal';audio.sfx('menu');saveOpts();}else if(id==='timer'){G.opts.timer=!G.opts.timer;audio.sfx('menu');saveOpts();}else if(id==='flash'){G.opts.flash=G.opts.flash==='reduced'?'normal':G.opts.flash==='normal'?'auto':'reduced';audio.sfx('menu');saveOpts();}else if(id==='cool'){G.opts.cooling=G.opts.cooling==='jars'?'normal':'jars';audio.sfx('menu');saveOpts();}
      else if(id==='bsize'){const t=touchOpts();t.size=(t.size+1)%3;applyTouchOpts();audio.sfx('menu');saveOpts();}else if(id==='hand'){const t=touchOpts();t.left=!t.left;applyTouchOpts();audio.sfx('menu');saveOpts();}else if(id==='swipe'){const t=touchOpts();t.swipe=!t.swipe;audio.sfx('menu');saveOpts();}}
    pressed.b=0;pressed.c=0;pressed.item=0;return;}
  if(G.scene==='intro'){G.introT++;if(!G.opts.introSeen){G.opts.introSeen=true;saveOpts();}if(justPressed('start')){newGame();return;}
    if(justPressed('a')||G.introT>INTRO[G.introPhase].len){if(G.introPhase===3){newGame();return;}G.introPhase++;G.introT=0;}pressed.b=0;return;}
  if(G.scene==='ending'){G.endT++;if(G.endT>180&&(justPressed('start')||justPressed('a'))){G.scene='title';G.menu=0;checkSave();loadOpts();audio.play('village');}return;}
  if(G.trans){G.trans.t++;if(G.trans.t>=22)G.trans=null;return;}
  if(G.cut){updateCut();return;}
  if(G.fade){G.fade+=G.fadeTo?0.08:-0.08;if(G.fade>=1&&G.fadeTo){const cb=G.fadeTo;G.fadeTo=null;cb();}if(G.fade<=0)G.fade=0;return;}
  if(justPressed('start')){G.paused=!G.paused;audio.sfx('menu');}if(G.paused){if(justPressed('left')||justPressed('right')){G.pauseTab=G.pauseTab==='quests'?'map':'quests';audio.sfx('menu');}if(G.pauseTab==='quests'){const pages=Math.ceil(questList().length/4);if(justPressed('down')){G.questPage=((G.questPage||0)+1)%pages;audio.sfx('menu');}if(justPressed('up')){G.questPage=((G.questPage||0)+pages-1)%pages;audio.sfx('menu');}}if(justPressed('b')){G.help=true;audio.sfx('menu');}if(justPressed('item')){G.showStats=true;audio.sfx('menu');}if(justPressed('c')){G.paused=false;audio.sfx('menu');toppingsMenu();}
    if(justPressed('a')){G.paused=false;ask('Quit to the title? Progress is saved at every door.',['Keep playing','Quit'],i=>{if(i===1){saveGame();G.scene='title';G.menu=0;G.paused=false;checkSave();loadOpts();audio.play('village');}});}return;}
  const goal=goalText();if(goal!==G.goal){G.goal=goal;G.banner={text:goal,t:240};}
  if(G.msg){G.skipHold=keys.b?(G.skipHold||0)+1:0;if(G.skipHold===24){G.msgQ=[];G.msgChar=msgTotal();nextMsg();if(!G.msg)P.hurt=Math.max(P.hurt,20);audio.sfx('menu');}
    if(justPressed('a')||justPressed('b')||justPressed('start')){if(G.msgChar<msgTotal())G.msgChar=msgTotal();else{nextMsg();if(!G.msg)P.hurt=Math.max(P.hurt,20);}}pressed.a=0;pressed.b=0;pressed.c=0;pressed.item=0;released.b=0;return;}
  if(G.hitstop>0){G.hitstop--;return;}
  if(P.melting){updateMelt();return;}
  updatePlayer();updateEnemies();updateMechanics();updateCam(false);if(G.shake>0)G.shake--;}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);lights=[];tapZones=[];
  if(G.scene==='title'){drawTitle();drawChoice();if(G.help)drawHelp();return;}if(G.scene==='intro'){drawIntro();return;}if(G.scene==='ending'){drawEnding();return;}
  drawScene();
  if(G.trans){const k=G.trans.t/22,e=1-Math.pow(1-k,3);const d=G.trans.dir;const dx=d===2?1:d===3?-1:0,dy=d===1?1:d===0?-1:0;const sw=W,sh=H-HUD;
    bctx.clearRect(0,0,W,H);bctx.drawImage(cv,0,0);ctx.clearRect(0,0,W,H-HUD);
    ctx.drawImage(snap,0,0,W,sh,Math.round(dx*e*sw),Math.round(dy*e*sh),W,sh);ctx.drawImage(buf,0,0,W,sh,Math.round(dx*(e-1)*sw),Math.round(dy*(e-1)*sh),W,sh);}
  drawHUD();drawCut();drawMsg();drawChoice();if(!G.msg&&!G.choice)drawBanner();
  if(G.paused){if(G.pauseTab==='quests')drawQuests();else drawPause();}if(G.help)drawHelp();if(G.showStats)drawStats();if(G.showBadges)drawBadges();
  if(G.fade){ctx.fillStyle='rgba(23,17,28,'+Math.min(1,G.fade)+')';ctx.fillRect(0,0,W,H);}}
let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(100,ts-last);last=ts;acc+=dt;while(acc>=1000/60){step();acc-=1000/60;}render();}
function fit(){const wrapEl=document.getElementById('wrap');const touch=document.body.classList.contains('touch');const land=innerWidth>innerHeight;
  let s=touch?(land?Math.min((innerWidth-40)/W,(innerHeight-20)/H):Math.min(wrapEl.clientWidth/W,innerHeight*0.56/H)):Math.min(wrapEl.clientWidth/W,wrapEl.clientHeight/H);
  // snap to a whole number of device pixels per game pixel so sprites never shimmer
  const dpr=window.devicePixelRatio||1;const dev=Math.floor(s*dpr);if(dev>=1)s=dev/dpr;else s=Math.max(0.9,s);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('orientationchange',()=>setTimeout(fit,100));
addEventListener('resize',fit);fit();checkSave();loadOpts();
// pause when the app goes to the background (calls, tab switches)
const autoPause=()=>{if(G.scene==='play'&&!G.paused&&!G.msg&&!G.choice){G.paused=true;}};document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause();});addEventListener('blur',autoPause);
if(document.fonts)document.fonts.load('8px "Press Start 2P"').then(()=>{logoCache=null;}).catch(()=>{});
requestAnimationFrame(loop);
</script>
