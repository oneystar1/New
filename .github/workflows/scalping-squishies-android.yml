# Scalping Squishies Android: builds a signed release bundle (AAB) on Linux
# and, when a Play service account is present, uploads it to the internal
# testing track. Mirrors the iOS workflow: everything is gated on secrets.
# Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Optional secrets: PLAY_SERVICE_ACCOUNT_JSON (upload), ADMOB_ANDROID_APP_ID,
# ADMOB_ANDROID_REWARDED_UNIT, ADMOB_ANDROID_INTERSTITIAL_UNIT, RC_ANDROID_KEY.
# See scalping-squishies/docs/ci.md.
name: Scalping Squishies Android

on:
  workflow_dispatch:
    inputs:
      admob_testing:
        description: Use Google's test ad units (keep true until the store release)
        type: choice
        options: ['true', 'false']
        default: 'true'
  push:
    tags: ['ss-android-v*']

concurrency:
  group: ss-android
  cancel-in-progress: false

defaults:
  run:
    working-directory: scalping-squishies

jobs:
  bundle:
    name: Build and upload release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are in place
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See scalping-squishies/docs/ci.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scalping-squishies/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build the web bundle
        env:
          VITE_API_URL: ${{ vars.SS_API_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.SS_SUPPORT_EMAIL }}
          VITE_SITE_URL: ${{ vars.SS_SITE_URL }}
          VITE_ADMOB_REWARDED: ${{ secrets.ADMOB_ANDROID_REWARDED_UNIT }}
          VITE_ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_UNIT }}
          VITE_ADMOB_TESTING: ${{ github.event.inputs.admob_testing || 'true' }}
          VITE_RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
          VITE_APP_VERSION: 0.1.${{ github.run_number }}
        run: npx tsc --noEmit && npx vite build
      - name: Generate the Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: App icon and splash from assets/
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#1a1030' --iconBackgroundColorDark '#1a1030' --splashBackgroundColor '#1a1030' --splashBackgroundColorDark '#1a1030'
      - name: AdMob app id in the manifest
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: bash tools/android-manifest.sh android/app/src/main/AndroidManifest.xml
      - name: Version code and signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
                  versionName System.getenv("VERSION_NAME") ?: "0.1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Build the release bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: scalping-squishies/android/app/build/outputs/bundle/release/app-release.aab
      - name: Is a Play service account configured?
        id: gate
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set; the bundle is in the artifact, upload skipped."
          fi
      - name: Upload to Google Play (internal testing)
        if: steps.gate.outputs.skip != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.oneycollectibles.scalpingsquishies
          releaseFiles: scalping-squishies/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
