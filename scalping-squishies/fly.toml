# Fly.io config for the Scalping Squishies API. One small machine, one
# volume for the SQLite file. Deployed by server/deploy.sh from CI.
app = "scalping-squishies-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  SS_PORT = "8787"
  SS_DB = "/data/data.db"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/v1/health"

[mounts]
  source = "ss_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
