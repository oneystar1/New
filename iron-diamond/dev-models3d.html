<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap"></head>
<body style="margin:0;background:#0b0f1e"><canvas id="c" width="1600" height="900" style="width:1600px;height:900px"></canvas>
<script src="vendor/three.min.js"></script><script src="src/core.js"></script><script src="src/data.js"></script><script src="src/robots.js"></script><script src="src/robots3d.js"></script>
<script>
const Game = { settings: {} };
function batSwingDir(p, hand, kind) { let psi, el; if (kind === 'bunt') { psi = 0; el = 5; } else if (p == null) { psi = 200; el = 65; } else if (p < 0.45) { const k = p / 0.45; psi = 200 + 160 * k; el = 65 - 68 * k; } else { const k = Math.min(1, (p - 0.45) / 0.55); psi = 360 + 120 * k; el = -3 + 53 * k; } if (hand < 0) psi = 180 - psi; psi *= DEG; el *= DEG; return [Math.cos(el) * Math.cos(psi), Math.cos(el) * Math.sin(psi), Math.sin(el)]; }
const q = new URLSearchParams(location.search), kind = q.get('pose') || 'bat', view = q.get('view') || 'back', p = q.get('p') == null ? null : +q.get('p');
const c = document.getElementById('c'), x = c.getContext('2d'); x.setTransform(1600 / W, 0, 0, 900 / H, 0, 0);
const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a2140'); g.addColorStop(1, '#2a4a2a'); x.fillStyle = g; x.fillRect(0, 0, W, H);
const cam = new Cam(); const D = view === 'back' ? [0, -34, 7] : view === 'front' ? [0, 34, 7] : [34, 0, 7]; cam.set(D[0], D[1], D[2], 0, 0, 3.6, 1100);
const cls = ['STRIKER', 'TITAN', 'VECTOR', 'RAPTOR'], tms = [0, 1, 3, 10];
R3D.begin();
cls.forEach((k, i) => { const X = (i - 1.5) * 7.5, r = { cls: k, num: [7, 44, 3, 21][i], hand: 1, hp: 100, maxHp: 100 };
  const o = { t: 1.2, hand: 1, kind, p, run: 1 };
  if (kind === 'bat' || kind === 'bunt') { const bx = X; let hx = bx + 0.55, hy = 0.2, hz = 4.6, kk = kind === 'bunt' ? 'bunt' : null; if (kk) { hx = bx + 0.9; hy = 0.5; hz = 3.1; } else if (p != null) { const k2 = p < 0.45 ? p / 0.45 : 1 - (p - 0.45) / 0.55 * 0.4; hx = bx + 0.55 + 0.7 * k2; hy = 0.2 + 0.5 * k2; hz = 4.6 - 1.3 * k2; } o.grip = [hx, hy, hz]; o.dir = batSwingDir(p, 1, kk); }
  const yaw = kind === 'bat' || kind === 'bunt' ? Math.atan2(1, 0) : kind === 'catcher' ? Math.atan2(0, -1) : Math.atan2(0, 1);
  R3D.add(r, TEAMS[tms[i]], X, 0, yaw, 1, o, false); });
R3D.draw(x, cam, c);
x.fillStyle = '#fff'; x.font = '700 14px Orbitron'; x.fillText(`${kind} p=${p} view=${view}`, 10, 20); window.done = true;
</script></body></html>
