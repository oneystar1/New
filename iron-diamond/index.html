<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070f">
<title>Iron Diamond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap">
<style>
  :root { --bg: #05070f; --panel: #0f1528; --line: #26305a; --fg: #e8ecff; --muted: #8f97b8; --accent: #46e0ff; --pink: #ff3d8a; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; max-width: 100vw; }
  body { font-family: Rajdhani, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #stage { position: relative; width: min(100%, calc((100dvh - 90px) * 16 / 9)); max-width: 1280px; aspect-ratio: 16 / 9; }
  #game { width: 100%; height: 100%; display: block; background: #000; border-radius: 10px; outline: none; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6), 0 0 80px rgba(70,224,255,.08); touch-action: none; }
  #game:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  #focus { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(5,7,15,.78); border-radius: 10px; cursor: pointer;
    font-family: Orbitron, sans-serif; font-weight: 900; letter-spacing: .08em; color: #fff; text-align: center; font-size: clamp(14px, 2.4vw, 26px); text-shadow: 0 0 18px var(--accent); }
  #focus small { font-family: Rajdhani, sans-serif; font-weight: 700; letter-spacing: .04em; font-size: .6em; color: var(--muted); text-shadow: none; }
  #focus[hidden] { display: none; }
  #help { width: 100%; max-width: 1280px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 6px 22px; justify-content: center; font-size: 14px; font-weight: 700; color: var(--muted); }
  #help b { color: var(--fg); font-weight: 700; }
  kbd { font-family: inherit; background: #182040; border: 1px solid #34407a; border-bottom-width: 3px; border-radius: 4px; padding: 0 6px; color: #fff; font-size: 13px; }
  :root { --stick: 170px; --btn: 84px; }
  #touch { display: none; user-select: none; -webkit-user-select: none; touch-action: none; }
  body.touch #touch { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; box-sizing: border-box; gap: 12px; }
  body.touch #help { display: none; }
  body.touch:not(.overlay) #touch { flex: 1 1 auto; align-content: center; padding-bottom: 12px; }
  #stick { justify-self: start; position: relative; width: var(--stick); height: var(--stick); border-radius: 50%; touch-action: none;
    background: radial-gradient(circle, rgba(70,224,255,.08) 0 28%, rgba(16,22,46,.9) 29% 100%); border: 2px solid rgba(70,224,255,.5); box-shadow: inset 0 0 30px rgba(70,224,255,.14), 0 8px 24px rgba(0,0,0,.45); }
  #stick i { position: absolute; color: rgba(160,190,230,.55); font-style: normal; font-size: calc(var(--stick) * .11); line-height: 1; }
  #stick .u { left: 50%; top: 6%; transform: translateX(-50%); } #stick .d { left: 50%; bottom: 6%; transform: translateX(-50%); }
  #stick .l { top: 50%; left: 6%; transform: translateY(-50%); } #stick .r { top: 50%; right: 6%; transform: translateY(-50%); }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--stick) * .44); height: calc(var(--stick) * .44); margin: calc(var(--stick) * -.22) 0 0 calc(var(--stick) * -.22); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #6a7cc0, #1d2547 72%); border: 2px solid #7fe8ff; box-shadow: 0 0 18px rgba(70,224,255,.5); transition: transform .08s; }
  #stick.on #knob { transition: none; }
  .btns { justify-self: end; display: grid; grid-template-columns: auto auto; gap: calc(var(--btn) * .14); align-items: end; }
  #touch button { font-family: Orbitron, sans-serif; font-weight: 900; color: #fff; background: #141b36; border: 2px solid var(--line); touch-action: none; -webkit-user-select: none; user-select: none; }
  #touch button.on { background: #26305a; transform: scale(.94); }
  .btns button { width: var(--btn); height: var(--btn); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: calc(var(--btn) * .34); line-height: 1; gap: calc(var(--btn) * .04); }
  .btns button span { font-family: Rajdhani, sans-serif; font-size: calc(var(--btn) * .15); letter-spacing: .05em; color: #c8d2f0; }
  .btns .b { margin-top: calc(var(--btn) * .7); border-color: var(--pink) !important; box-shadow: 0 0 16px rgba(255,61,138,.3); }
  .btns .a { margin-bottom: calc(var(--btn) * .5); border-color: var(--accent) !important; box-shadow: 0 0 16px rgba(70,224,255,.3); }
  .mid { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .mid button { border-radius: 999px; padding: .65em 1.2em; font-size: clamp(10px, calc(var(--btn) * .15), 15px); letter-spacing: .1em; white-space: nowrap; }
  #rotate { display: none; font-weight: 700; font-size: 14px; color: var(--muted); text-align: center; }
  @media (orientation: portrait) { body.touch #rotate { display: block; } }
  /* phones held sideways: controls float over the picture */
  body.touch.overlay { padding: 4px; }
  body.touch.overlay #touch { position: fixed; inset: auto 0 0 0; padding: 0 max(14px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right)); pointer-events: none; }
  body.touch.overlay #touch > * { pointer-events: auto; }
  body.touch.overlay #stick, body.touch.overlay .btns button { opacity: .62; }
  body.touch.overlay .mid { flex-direction: row; align-self: end; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540" tabindex="0" aria-label="Iron Diamond game screen"></canvas>
  <div id="focus">IRON DIAMOND<small>CLICK OR TAP TO POWER UP · SOUND ON</small></div>
</div>
<div id="help">
  <span><b>P1</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>J</kbd>/<kbd>Space</kbd> A · <kbd>K</kbd> B · <kbd>Enter</kbd> start</span>
  <span><b>P2</b> arrows · <kbd>,</kbd> A · <kbd>.</kbd> B · <kbd>Backspace</kbd> start</span>
  <span><b>Gamepads</b> supported · <kbd>M</kbd> mute</span>
</div>
<div id="rotate">Turn your phone sideways for the big-screen view</div>
<div id="touch">
  <div id="stick" aria-label="Joystick"><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i><div id="knob"></div></div>
  <div class="mid"><button data-k="start" aria-label="Start">START</button><button id="fs" aria-label="Full screen">⤢ FULL</button></div>
  <div class="btns"><button class="b" data-k="b" aria-label="B button">B<span id="lb">BACK</span></button><button class="a" data-k="a" aria-label="A button">A<span id="la">OK</span></button></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="src/core.js"></script>
<script src="src/voice.js"></script>
<script src="src/booth.js"></script>
<script src="src/data.js"></script>
<script src="src/robots.js"></script>
<script src="src/robots3d.js"></script>
<script src="src/stadium.js"></script>
<script src="src/themes.js"></script>
<script src="src/clash.js"></script>
<script src="src/match.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/season.js"></script>
<script src="src/practice.js"></script>
<script src="src/main.js"></script>
</body>
</html>
